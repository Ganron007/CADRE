[network]
subnet = 192.168.77.0/24
gateway = 192.168.77.1
dns_primary = 192.168.77.10
dns_secondary = 192.168.77.11

[deploy]
provisioning_user = vagrant
provisioning_vm = provisioning
provider = vmware_desktop
vagrant_box_windows = gusztavvargadr/windows-server-2025-standard
vagrant_box_ubuntu = bento/ubuntu-24.04

[paths]
ansible_dir = ansible
inventory_path = ansible/inventories/hosts
config_path = lab/data/config.json
vagrantfile_path = lab/providers/vmware/Vagrantfile

[extensions]
available = elk-fleet, net-monitor, velociraptor, misp, c2stack
