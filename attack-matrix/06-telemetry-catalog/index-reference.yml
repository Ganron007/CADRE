    elastic_pattern: logs-zeek.conn-*
    protocols: [TCP, UDP, ICMP]
  - name: dns.log
    elastic_pattern: logs-zeek.dns-*
    protocols: [DNS]
  - name: http.log
    elastic_pattern: logs-zeek.http-*
    protocols: [HTTP]
  - name: kerberos.log
    elastic_pattern: logs-zeek.kerberos-*
    protocols: [Kerberos]
  - name: smb_cmd.log
    elastic_pattern: logs-zeek.smb_cmd-*
    protocols: [SMB]
  - name: smb_files.log
    elastic_pattern: logs-zeek.smb_files-*
    protocols: [SMB]
  - name: smb_mapping.log
    elastic_pattern: logs-zeek.smb_mapping-*
    protocols: [SMB]
  - name: ssl.log
    elastic_pattern: logs-zeek.ssl-*
    protocols: [TLS]
  - name: dcerpc.log
    elastic_pattern: logs-zeek.dcerpc-*
    protocols: [DCE/RPC]
  - name: ntlm.log
    elastic_pattern: logs-zeek.ntlm-*
    protocols: [NTLM]
  - name: notice.log
    elastic_pattern: logs-zeek.notice-*
    protocols: [Zeek alerts]

# ────────────────────────────────────────────────────────────
# Seed Detection Rules (deployed by 12-elk-fleet.yml)
# ────────────────────────────────────────────────────────────
detection_rules:
  # Windows rules
  - rule_id: cadre-002-asrep-roast
    name: AS-REP Roasting
    index: [logs-system.security-*]
    query: event.code:4768 AND winlog.event_data.PreAuthType:0
    mitre: T1558.004
  - rule_id: cadre-003-dcsync
    name: DCSync Detected
    index: [logs-system.security-*]
    query: event.code:4662 AND winlog.event_data.AccessMask:*1400* AND winlog.event_data.Properties:*1131f6aa-*
    mitre: T1003.006
  - rule_id: cadre-004-suspicious-proc
    name: Suspicious Sysmon Process
    index: [logs-windows.sysmon_operational-*]
    query: event.code:1 AND winlog.event_data.CommandLine:(*mimikatz* OR *Rubeus* ...)
    mitre: T1059
  - rule_id: cadre-005-adcs-tamper
    name: ADCS Template Modification
    index: [logs-system.security-*]
    query: event.code:(4899 OR 4900 OR 4902) AND ObjectName:*Certificate*Templates*
    mitre: T1649
  - rule_id: cadre-006-ntlm-relay
    name: NTLM Relay — Multi-Host Logon
    index: [logs-system.security-*]
    query: event.code:4624 AND LogonType:3 (threshold)
    mitre: T1557.001
  - rule_id: cadre-008-gmsa-extract
    name: gMSA Password Extraction
    index: [logs-system.security-*]
    query: event.code:4662 AND ObjectType:msDS-ManagedPassword
    mitre: T1552.005
  # Linux rules
  - rule_id: cadre-l01-keytab-read
    name: Keytab File Read
    index: [logs-auditd.log-*]
    query: auditd.key:(keytab_access OR mssql_keytab)
    mitre: T1558.003
  - rule_id: cadre-l02-realm-change
    name: Realm Join/Leave
    index: [logs-auditd.log-*]
    query: auditd.key:realmd_exec
    mitre: T1484
  - rule_id: cadre-l03-sssd-cache
    name: SSSD Cache Read
    index: [logs-auditd.log-*]
    query: auditd.key:(sssd_db OR sssd_secrets)
    mitre: T1003.008
  - rule_id: cadre-l04-suid-binary
    name: New SUID Binary (osquery)
    index: [logs-osquery_manager.result-*]
    query: osquery.name:suid_bin
    mitre: T1548.001
  - rule_id: cadre-l05-kernel-module
    name: Kernel Module Load
    index: [logs-auditd.log-*]
    query: auditd.key:kernel_module
    mitre: T1547.006
  - rule_id: cadre-l06-preload-hijack
    name: ld.so.preload Write
    index: [logs-auditd.log-*]
    query: auditd.key:preload_hijack
    mitre: T1574.006
  - rule_id: cadre-l07-container-escape
    name: Container Escape
    index: [logs-auditd.log-*]
    query: auditd.key:container_escape
    mitre: T1611
  - rule_id: cadre-l08-cron-systemd
    name: New Cron or Systemd Unit
    index: [logs-auditd.log-*]
    query: auditd.key:(cron_dir OR cron_daily OR cron_hourly OR systemd_units)
    mitre: [T1053.003, T1543.002]
  - rule_id: cadre-l09-mssql-brute
    name: MSSQL Failed Login Burst
    index: [logs-mssql.audit.linux-*]
    query: mssql.audit.event_type:FAILED_LOGIN_GROUP (threshold)
    mitre: T1110
  # cadre-l10 removed — xp_cmdshell impossible on SQL Server Linux (xpstar.dll absent). L-numbering gap reserved.
  - rule_id: cadre-l11-nfs-krb5
    name: NFS Mount with Kerberos
    index: [logs-auditd.log-*]
    query: auditd.key:nfs_mount
    mitre: T1021.002
  - rule_id: cadre-l12-authorized-keys
    name: Authorized Keys Modified
    index: [logs-auditd.log-*]
    query: auditd.key:home_access AND auditd.file.name:authorized_keys
    mitre: T1098.004
  - rule_id: cadre-l13-pam-change
    name: PAM Configuration Change
    index: [logs-auditd.log-*]
    query: auditd.key:pam_config
    mitre: T1556.003
  - rule_id: cadre-l14-temp-exec
    name: Process from Temp Directory
    index: [logs-auditd.log-*]
    query: auditd.key:proc_exec AND auditd.exe:(/tmp/* OR /dev/shm/* OR /var/tmp/*)
    mitre: T1059
  - rule_id: cadre-l15-sudo-domain
    name: Domain User sudo Execution
    index: [logs-system.auth-*]
    query: event.action:sudo AND user.id:*1* AND user.id:*0* AND NOT user.name:vagrant
    mitre: T1078.002

# ────────────────────────────────────────────────────────────
# Campaign structure (from CAMPAIGNS.md)
# ────────────────────────────────────────────────────────────
campaigns:
  A: From the Network — Kali zero-creds → 3 domains (8 phases, 25 WT#)
  B: Shadow in Root — cadre.local ACLs + persistence (5 phases, 13 WT#)
  C: From the Edge — range.local SCCM + delegation (4 phases, 13 WT#)
  D: Linux Pivot — linux01 post-exploit (4 phases, 5 WT#)

