    for: [spine:0.5]
  P-CHILD:
    required_hosts: [provisioning, dc01, dc02, mbr01]
    for: [spine:0, spine:1, spine:2, spine:3, branch:A, branch:B, branch:sql-ai]
  P-CREDS:
    required_hosts: [provisioning, dc01, dc02, mbr01]
    for: [spine:3.5]
