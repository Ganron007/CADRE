  P-FOREST:
    required_hosts: [provisioning, dc01, dc02, dc03, mbr01, mbr02]
    for: [spine:7, spine:8, branch:C]
  P-LINUX:
    required_hosts: [provisioning, dc01, mbr01, linux01]
    for: [branch:D]
  P-NETDEF:
    required_hosts: [provisioning, dc01, dc02, monitor]
    for: [branch:E]
  P-SUPPLY:
    required_hosts: [provisioning, linux01, mbr01]
    for: [branch:F]
  P-FULL:
    required_hosts: [provisioning, dc01, dc02, dc03, mbr01, mbr02, linux01, ws01]
