<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="CADRE godfather logo">
  <defs>
    <!-- Base Shield Gradient (Godfather Gold/Bronze) -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2b867"/>
      <stop offset="50%" stop-color="#9a6a22"/>
      <stop offset="100%" stop-color="#452c08"/>
    </linearGradient>
    <!-- Wordmark Gradient -->
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fce7aa"/>
      <stop offset="100%" stop-color="#b48332"/>
    </linearGradient>
  </defs>

  <!-- Shield icon with Chess King master controller and AI sparkle -->
  <g transform="translate(24,28)">
    <!-- Sleek outer shield path -->
    <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z"
          fill="url(#goldGrad)" stroke="#452c08" stroke-width="2"/>
          
    <!-- AI Sparkle in upper-right area -->
    <path d="M85 24 Q85 32 93 32 Q85 32 85 40 Q85 32 77 32 Q85 32 85 24 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Chess King master controller -->
    <!-- Cross -->
    <path d="M55 18 V30 M49 24 H61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    <!-- Crown Head -->
    <path d="M36 45 C36 45 42 38 55 42 C68 38 74 45 74 45 L70 66 H40 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="55" cy="42" r="2.5" fill="#9a6a22"/> <!-- Crown core -->
    <!-- Neck/Collar -->
    <rect x="42" y="68" width="26" height="5" rx="1" fill="#ffffff" opacity="0.95"/>
    <!-- Body -->
    <path d="M46 75 L38 105 H72 L64 75 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Base Plates -->
    <rect x="33" y="107" width="44" height="6" rx="1.5" fill="#ffffff" opacity="0.95"/>
    <rect x="26" y="115" width="58" height="8" rx="2" fill="#ffffff" opacity="0.95"/>
    
    <!-- Connecting orchestration lines -->
    <line x1="26" y1="120" x2="10" y2="135" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="84" y1="120" x2="100" y2="135" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="55" y1="123" x2="55" y2="138" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Node endpoints -->
    <circle cx="10" cy="135" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="100" cy="135" r="4" fill="#ffffff" opacity="0.95"/>
    <circle cx="55" cy="138" r="4" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="900" fill="url(#wordGrad)" letter-spacing="2">CADRE</text>
        
  <!-- Tagline under the wordmark -->
  <text x="162" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.4">Cloud, Agentic, DFIR, and Red-Team Environment</text>
</svg>
