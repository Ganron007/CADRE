name: CADRE.Hunts.CredentialAccess
description: |
  Credential access forensic artifacts — AMCache, NTUser registry, prefetch.
  Part of the CADRE pre-built hunt library.
sources:
  - name: AMCache
    queries:
      - SELECT * FROM Artifact.Windows.Forensics.AMCache()
  - name: NTUserRegistry
    queries:
      - SELECT * FROM Artifact.Windows.Registry.NTUser()
  - name: Prefetch
    queries:
      - SELECT * FROM Artifact.Windows.Search.Prefetch()
