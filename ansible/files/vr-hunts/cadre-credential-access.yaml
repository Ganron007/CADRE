name: CADRE.Hunts.CredentialAccess
description: |
  Execution and credential-adjacent artifacts (library hunt).
  Prefetch, Amcache, BAM, NTUser, PSReadline, WDigest. No LSASS dump, no memory.
sources:
  - name: Prefetch
    queries:
      - SELECT * FROM Artifact.Windows.Forensics.Prefetch()
  - name: Amcache
    queries:
      - SELECT * FROM Artifact.Windows.Forensics.Amcache()
  - name: Bam
    queries:
      - SELECT * FROM Artifact.Windows.Forensics.Bam()
  - name: NTUserRegistry
    queries:
      - SELECT * FROM Artifact.Windows.Registry.NTUser()
  - name: PSReadline
    queries:
      - SELECT * FROM Artifact.Windows.System.Powershell.PSReadline()
  - name: WDigest
    queries:
      - SELECT * FROM Artifact.Windows.Registry.WDigest()
