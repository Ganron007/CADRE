name: CADRE.Hunts.FilesystemTimeline
description: |
  NTFS MFT + USN (library hunt — heavy; not Stage 0 default).
  No memory, no full disk image. Prefer KAPE on SSH targets; use this on VR-only hosts when needed.
sources:
  - name: MFT
    queries:
      - SELECT * FROM Artifact.Windows.NTFS.MFT()
  - name: USN
    queries:
      - SELECT * FROM Artifact.Windows.Forensics.Usn()
