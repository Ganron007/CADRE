name: CADRE.Hunts.SCCMSnapshot
description: |
  SCCM configuration snapshot — NAA, client push, boundaries via WMI (library hunt).
  Site code CAD (CADRE lab). Empty on hosts without the SMS provider.
sources:
  - name: NAA
    queries:
      - SELECT * FROM wmi(query="SELECT * FROM SMS_NAA WHERE SiteCode='CAD'")
  - name: ClientPush
    queries:
      - SELECT * FROM wmi(query="SELECT * FROM SMS_SCI_ClientComp WHERE ClientComponent='Client Push Installation'")
  - name: Boundaries
    queries:
      - SELECT * FROM wmi(query="SELECT * FROM SMS_DP_Boundaries")
