name: CADRE.Hunts.LinuxTriage
description: |
  Library hunt (not Stage 0 default). Runs CADRE.Hunts.LinuxIRTriage then adds
  the journal dump. IR process/net/SSH/persistence/packages live in LinuxIRTriage.
  No AVML, no UAC zip, no private keys.
sources:
  - name: IRTriage
    queries:
      - SELECT * FROM Artifact.CADRE.Hunts.LinuxIRTriage()
  - name: Journal
    queries:
      - SELECT * FROM Artifact.Linux.Forensics.Journal()
