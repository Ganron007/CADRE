%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[192.168.77.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    FTP_DATA_SERVERS: "$EXTERNAL_NET"
    FTP_SERVERS: "$HOME_NET"
    SSH_SERVERS: "$HOME_NET"
    SIP_SERVERS: "$HOME_NET"
    LDAP_SERVERS: "$HOME_NET"
    RDP_SERVERS: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80,443,8080,8443,8888"
    SMTP_PORTS: "25,465,587"
    ORACLE_PORTS: "1024:"
    SHELLCODE_PORTS: "80,443,8080,8443"
    SSH_PORTS: "22"

af-packet:
  - interface: eth1
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

default-rule-path: /var/lib/suricata/rules

rule-files:
  - cadre-ad.rules
  - cadre-phaseb.rules
  - cadre-et-lab.rules
  - cadre-supplychain.rules

app-layer:
  protocols:
    tls:
      ja3-fingerprints: yes
      ja4-fingerprints: yes
    krb5:
      enabled: yes
    smb:
      enabled: yes
    dns:
      enabled: yes
    http:
      enabled: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - dns
        - tls
        - ssh
        - krb5
        - smb
