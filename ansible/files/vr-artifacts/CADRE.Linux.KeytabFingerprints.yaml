name: CADRE.Linux.KeytabFingerprints
description: |
  Collect keytab file fingerprints from krb5.keytab and mssql.keytab.
  Runs klist -ke on each keytab found to enumerate service principals and encryption types.
parameters:
  - name: keytabPaths
    description: Glob paths to search for keytab files
    default: /etc/krb5.keytab,/var/opt/mssql/secrets/mssql.keytab
sources:
  - name: Inventory
    precondition: |
      SELECT OS FROM info()
      WHERE OS = 'linux'
    query: |
      SELECT OSPath AS FullPath, Mtime AS Modified, Size
      FROM glob(globs=split(string=keytabPaths, sep=","))
  - name: Principals
    precondition: |
      SELECT OS FROM info()
      WHERE OS = 'linux'
    query: |
      SELECT * FROM foreach(
        row={
          SELECT OSPath AS FullPath FROM glob(globs=split(string=keytabPaths, sep=","))
        },
        query={
          SELECT FullPath, Stdout AS KeytabOutput
          FROM execve(argv=["klist", "-ke", "-t", FullPath])
        })
