    - name: "[PREP] Verify range.local users in groups"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $group = "{{ item.group }}"
          $members = '{{ item.users | join(",") }}'.Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)
          $existing = Get-ADGroupMember -Identity $group | Select-Object -ExpandProperty SamAccountName
          $missing = $members | Where-Object { $_ -notin $existing }
          if ($missing.Count -eq 0) { Write-Output "PASS: All members in $group"; exit 0 }
          Write-Output "FAIL: $group missing members: $($missing -join ', ')"; exit 1
        } catch { Write-Output "FAIL: Group membership $group — $_"; exit 1 }
      loop:
        - { group: "Intelligence-Cadre", users: ["dir_intelligence", "analyst_osint", "analyst_malware", "analyst_forensic", "intern_intel"] }
        - { group: "Adversary-Cadre", users: ["adversary_lead"] }
        - { group: "Tools-Eng", users: ["eng_tools"] }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[PREP][WT#34] Verify svc_naa in Domain Admins (range.local)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $member = Get-ADGroupMember -Identity "Domain Admins" | Where-Object { $_.SamAccountName -eq "svc_naa" }
          if ($member) { Write-Output "PASS: svc_naa in Domain Admins"; exit 0 }
          Write-Output "FAIL: svc_naa not in Domain Admins"; exit 1
        } catch { Write-Output "FAIL: svc_naa → Domain Admins — $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[PREP][WT#26] Verify dMSA dmsaPrivService exists"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $dmsa = Get-ADServiceAccount -Identity "dmsaPrivService" -ErrorAction SilentlyContinue
          if ($dmsa) { Write-Output "PASS: dMSA dmsaPrivService exists"; exit 0 }
