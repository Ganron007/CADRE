    - name: "[PREP] Verify 10 users in range.local"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $uName = "{{ item.uname }}"
          $existing = Get-ADUser -Identity $uName -ErrorAction SilentlyContinue
          if ($existing) { Write-Output "PASS: User $uName exists"; exit 0 }
          Write-Output "FAIL: User $uName not found"; exit 1
        } catch { Write-Output "FAIL: User $uName — $_"; exit 1 }
      loop:
        - { uname: dir_intelligence, pw: "D1r_1nt3l!", ou: Intelligence }
        - { uname: analyst_osint, pw: "0S1NT_An@lyst!", ou: Intelligence }
        - { uname: analyst_malware, pw: "M@lw@r3_An@lyst!", ou: Intelligence }
        - { uname: analyst_forensic, pw: "F0r3ns1c_An@lyst!", ou: Intelligence }
        - { uname: adversary_lead, pw: "Adv3rsary_L3ad!", ou: Adversary }
        - { uname: intern_intel, pw: "1nt3rn_Int3l!", ou: Intelligence }
        - { uname: eng_tools, pw: "T00ls_3ng!", ou: Intelligence }
        - { uname: svc_mssql, pw: "s3rv1c3_MSSQL!", ou: Intelligence }
        - { uname: svc_sccm, pw: "s3rv1c3_SCCM!", ou: Adversary }
        - { uname: svc_naa, pw: "N@A_s3rv1c3!", ou: Adversary }
