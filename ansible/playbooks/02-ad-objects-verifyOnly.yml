          $ouName = "{{ item.name }}"
          $existing = Get-ADOrganizationalUnit -Filter "Name -eq '$ouName'" -SearchBase "dc=range,dc=local" -ErrorAction SilentlyContinue
          if ($existing) { Write-Output "PASS: OU $ouName exists"; exit 0 }
          Write-Output "FAIL: OU $ouName not found"; exit 1
        } catch { Write-Output "FAIL: OU $ouName — $_"; exit 1 }
      loop:
        - { name: Intelligence, desc: "Threat intelligence" }
        - { name: Adversary, desc: "Adversary simulation" }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[PREP] Verify 3 groups in range.local"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $gName = "{{ item.name }}"
          $existing = Get-ADGroup -Identity $gName -ErrorAction SilentlyContinue
          if ($existing) { Write-Output "PASS: Group $gName exists"; exit 0 }
          Write-Output "FAIL: Group $gName not found"; exit 1
        } catch { Write-Output "FAIL: Group $gName — $_"; exit 1 }
      loop:
        - { name: Intelligence-Cadre, ou: Intelligence }
        - { name: Adversary-Cadre, ou: Adversary }
        - { name: Tools-Eng, ou: Intelligence }
      register: r
