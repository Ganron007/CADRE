---
# TYPE: DEPLOY (rc=0=skip, rc=2=applied+verified, rc=1=fail)
# Layer 4: Vulnerabilities — Deploy registry, services, features
# Uses native Ansible modules (win_regedit, win_service, win_feature)
# which are inherently idempotent — they read state before changing.
# Only dead gateway removal uses win_shell rc=2.

- name: "Deploy registry vulnerabilities on all DCs"
  hosts: root_dc:child_dc:external_dc
  gather_facts: false
  tasks:
    - name: "[VULN][WT#21] NTLM outbound allowed"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0
        name: RestrictSendingNTLMTraffic
        data: 0
        type: dword

    - name: "[VULN][WT#21] NTLM incoming allowed"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
        name: RestrictNTLMInDomain
        data: 0
        type: dword

    - name: "[VULN][WT#17] Print-Services feature installed (Spooler prerequisite)"
      ansible.windows.win_feature:
        name: Print-Services
        state: present
        include_management_tools: true
      register: r_printsvc
      failed_when: false

    - name: "[VULN][WT#17] Print Spooler enabled (auto)"
      ansible.windows.win_service:
        name: Spooler
        start_mode: auto
        state: started

    - name: "[VULN][WT#17] File and Printer Sharing firewall group enabled (Spooler RPC/SMB)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $group = Get-NetFirewallRule -DisplayGroup "File and Printer Sharing" -ErrorAction Stop
          $enabled = $group | Where-Object { $_.Enabled -eq $true }
          if ($enabled) { Write-Output "OK: File and Printer Sharing already enabled"; exit 0 }
          Enable-NetFirewallRule -DisplayGroup "File and Printer Sharing"
          $v = Get-NetFirewallRule -DisplayGroup "File and Printer Sharing" | Where-Object { $_.Enabled -eq $true }
          if (-not $v) { throw "Firewall group not enabled" }
          Write-Output "APPLIED: File and Printer Sharing firewall enabled"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Ensure TCP/445 inbound is allowed for Spooler path"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $name = "CADRE-Spooler-SMB-In"
          $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol TCP -LocalPort 445 -Action Allow -Profile Any -Enabled True | Out-Null
            Write-Output "APPLIED: $name"
          } else {
            Write-Output "OK: $name exists"
          }
          $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction Stop
          if ($rule.Enabled -ne $true) { throw "$name exists but is disabled" }
          exit 0
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Ensure TCP/135 inbound is allowed for Spooler RPC"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $name = "CADRE-Spooler-RPC-In"
          $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol TCP -LocalPort 135 -Action Allow -Profile Any -Enabled True | Out-Null
            Write-Output "APPLIED: $name"
          } else {
            Write-Output "OK: $name exists"
          }
          $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction Stop
          if ($rule.Enabled -ne $true) { throw "$name exists but is disabled" }
          exit 0
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Ensure dynamic RPC range inbound is allowed for Spooler"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $name = "CADRE-Spooler-RPC-Dynamic-In"
          $existing = Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue
          if (-not $existing) {
            New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol TCP -LocalPort 49152-65535 -Action Allow -Profile Any -Enabled True | Out-Null
            Write-Output "APPLIED: $name"
          } else {
            Write-Output "OK: $name exists"
          }
          $rule = Get-NetFirewallRule -DisplayName $name -ErrorAction Stop
          if ($rule.Enabled -ne $true) { throw "$name exists but is disabled" }
          exit 0
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    - name: "[VULN][WT#18] WebClient enabled (auto)"
      ansible.windows.win_service:
        name: WebClient
        start_mode: auto
        state: started

    - name: "[VULN][WT#20] FssAgent (ShadowCoerce) enabled (auto)"
      ansible.windows.win_service:
        name: FssAgent
        start_mode: auto
        state: started

    - name: "[VULN][WT#18] WebClient enabled (auto)"
      ansible.windows.win_service:
        name: WebClient
        start_mode: auto
        state: started

    - name: "[VULN][WT#18] WebDAV-Redirector feature installed"
      ansible.windows.win_feature:
        name: WebDAV-Redirector
        state: present

    - name: "[VULN][WT#19] DFS Namespace feature installed (DFSCoerce)"
      ansible.windows.win_feature:
        name: FS-DFS-Namespace
        state: present

    - name: "[VULN][WT#20] FSRVP feature installed (ShadowCoerce)"
      ansible.windows.win_feature:
        name: FS-VSS-Agent
        state: present

    - name: "[VULN][WT#20] FssAgent (ShadowCoerce) enabled (auto)"
      ansible.windows.win_service:
        name: FssAgent
        start_mode: auto
        state: started

    - name: "EFS service enabled (auto start) — PetitPotam target"
      ansible.windows.win_service:
        name: EFS
        start_mode: auto
        state: started

    - name: "[VULN][WT#21] LDAP signing NOT required (relay target)"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name: LDAPServerIntegrity
        data: 1
        type: dword

    - name: "[VULN][WT#59] ESC10 — StrongCertificateBindingEnforcement=0 on Kdc"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\Kdc
        name: StrongCertificateBindingEnforcement
        data: 0
        type: dword

    - name: "[VULN][WT#59] ESC10 — CertificateMappingMethods=31 on Schannel"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Schannel
        name: CertificateMappingMethods
        data: 31
        type: dword

# ws01 is the Windows beachhead (Elastic CADRE-All; no MDE). Soft Defender lives in 17-ws01-deploy.yml.
# Keep ws01 out of this hard vuln strip (WDigest / CG / LSA / full Defender kill).
- name: "Deploy registry vulnerabilities on Windows VMs (exclude ws01 beachhead)"
  hosts: windows_servers:!ws01
  gather_facts: false
  tasks:
    - name: "[VULN] WDigest credential caching enabled"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest
        name: UseLogonCredential
        data: 1
        type: dword

    - name: "[VULN] Credential Guard (LsaCfgFlags) disabled"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: LsaCfgFlags
        data: 0
        type: dword
      register: r_cg
      failed_when: false
      changed_when: r_cg is changed

    - name: "[VULN] Credential Guard VBS (EnableVBS) disabled"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard
        name: EnableVirtualizationBasedSecurity
        data: 0
        type: dword
      register: r_vbs
      failed_when: false

    - name: "[VULN] LSA Protection (RunAsPPL) removed"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RunAsPPL
        state: absent

    - name: "[VULN][WT#34] Restricted Admin Mode (RDP) enabled"
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Lsa
        name: DisableRestrictedAdmin
        data: 0
        type: dword

    - name: "[VULN][WT#H] RDP enabled (fDenyTSConnections=0)"
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: "[VULN][WT#H] RDP firewall rule enabled"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $rule = Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          if (-not $rule) { Write-Output "SKIP: RDP firewall group not found"; exit 0 }
          $enabled = $rule | Where-Object { $_.Enabled -eq $true }
          if ($enabled) { Write-Output "OK: RDP firewall already enabled"; exit 0 }
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $v = Get-NetFirewallRule -DisplayGroup "Remote Desktop" | Where-Object { $_.Enabled -eq $true }
          if (-not $v) { throw "Firewall rule not enabled" }
          Write-Output "APPLIED: RDP firewall rule enabled"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    # Lab attack paths (SQL/LDAP/SMB) expect host firewall OFF on servers. ws01 excluded (MDE baseline).
    - name: "[VULN] Windows Firewall profiles disabled (lab servers — not ws01)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $enabled = Get-NetFirewallProfile | Where-Object { $_.Enabled -eq $true }
          if (-not $enabled) { Write-Output "OK: All firewall profiles already disabled"; exit 0 }
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          $still = Get-NetFirewallProfile | Where-Object { $_.Enabled -eq $true }
          if ($still) { throw ("Still enabled: " + ($still.Name -join ',')) }
          Write-Output "APPLIED: Firewall profiles Domain/Public/Private disabled"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r_fw
      changed_when: r_fw.rc == 2
      failed_when: r_fw.rc == 1

    - name: "[VULN] Windows Defender fully disabled (Server 2025 compatible)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          # Check if already disabled
          $polPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender"
          $pol = Get-ItemProperty -Path $polPath -Name "DisableAntiSpyware" -ErrorAction SilentlyContinue
          if ($pol.DisableAntiSpyware -eq 1) { Write-Output "OK: Defender already disabled"; exit 0 }

          # Step 1: Disable Tamper Protection (critical — Server 2025 rejects all changes without this)
          $tpPath = "HKLM:\SOFTWARE\Microsoft\Windows Defender\Features"
          Set-ItemProperty -Path $tpPath -Name "TamperProtection" -Value 0 -Type DWord -Force

          # Step 2: Stop and disable the service
          Set-Service WinDefend -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service WinDefend -Force -ErrorAction SilentlyContinue

          # Step 3: Policy registry keys
          New-Item -Path $polPath -Force | Out-Null
          New-ItemProperty -Path $polPath -Name "DisableAntiSpyware" -Value 1 -Type DWord -Force

          $rtp = Join-Path $polPath "Real-Time Protection"
          New-Item -Path $rtp -Force | Out-Null
          New-ItemProperty -Path $rtp -Name "DisableRealtimeMonitoring" -Value 1 -Type DWord -Force
          New-ItemProperty -Path $rtp -Name "DisableBehaviorMonitoring" -Value 1 -Type DWord -Force
          New-ItemProperty -Path $rtp -Name "DisableOnAccessProtection" -Value 1 -Type DWord -Force
          New-ItemProperty -Path $rtp -Name "DisableIOAVProtection" -Value 1 -Type DWord -Force

          # Step 4: MpPreference — all protection layers
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIntrusionPreventionSystem $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBlockAtFirstSeen $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableArchiveScanning $true -ErrorAction SilentlyContinue
          Set-MpPreference -MAPSReporting 0 -ErrorAction SilentlyContinue
          Set-MpPreference -SubmitSamplesConsent 0 -ErrorAction SilentlyContinue
          Set-MpPreference -PUAProtection 0 -ErrorAction SilentlyContinue
          Set-MpPreference -ScanScheduleDay 8 -ErrorAction SilentlyContinue

          # Step 5: Spynet / cloud reporting off
          $spynet = Join-Path $polPath "SpyNet"
          New-Item -Path $spynet -Force | Out-Null
          New-ItemProperty -Path $spynet -Name "SpynetReporting" -Value 0 -Type DWord -Force
          New-ItemProperty -Path $spynet -Name "SubmitSamplesConsent" -Value 0 -Type DWord -Force

          # Verify
          $vPol = Get-ItemProperty -Path $polPath -Name "DisableAntiSpyware" -ErrorAction Stop
          if ($vPol.DisableAntiSpyware -ne 1) { throw "Policy registry not applied" }
          Write-Output "APPLIED: Defender fully disabled. Reboot required."; exit 2
        } catch { Write-Output "FAILED: Defender — $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

    - name: "[VULN] Reboot after Defender disable"
      ansible.windows.win_reboot:
        reboot_timeout: 600
      when: r.rc == 2

- name: "Deploy SMB signing disabled on mbr02"
  hosts: mbr02
  gather_facts: false
  tasks:
    - name: "[VULN][WT#22] SMB signing disabled on mbr02 (relay target)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $path = "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters"
          $req = (Get-ItemProperty -Path $path -Name "RequireSecuritySignature" -ErrorAction SilentlyContinue).RequireSecuritySignature
          $en = (Get-ItemProperty -Path $path -Name "EnableSecuritySignature" -ErrorAction SilentlyContinue).EnableSecuritySignature
          if ($req -eq 0 -and $en -eq 0) { Write-Output "OK: SMB signing already disabled"; exit 0 }
          Set-ItemProperty -Path $path -Name "RequireSecuritySignature" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $path -Name "EnableSecuritySignature" -Value 0 -Type DWord -Force
          $vReq = (Get-ItemProperty -Path $path -Name "RequireSecuritySignature" -ErrorAction Stop).RequireSecuritySignature
          $vEn = (Get-ItemProperty -Path $path -Name "EnableSecuritySignature" -ErrorAction Stop).EnableSecuritySignature
          if ($vReq -ne 0 -or $vEn -ne 0) { throw "Verify failed" }
          Write-Output "APPLIED: SMB signing disabled and verified"; exit 2
        } catch { Write-Output "FAILED: SMB signing — $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

- name: "Deploy null session enumeration on dc02"
  hosts: dc02
  gather_facts: false
  tasks:
    - name: "[VULN][WT#28] Null session enumeration enabled (dc02)"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
        name: RestrictAnonymous
        data: 0
        type: dword

# ws01 DNS/gateway is owned by 17-ws01-deploy.yml (dc02 = 192.168.77.11). Do not rewrites here.
- name: "DNS fix — adapter DNS + gateway cleanup (exclude ws01)"
  hosts: windows_servers:!ws01
  gather_facts: false
  tasks:
    - name: "Detect adapters — domain (vmnet2) vs NAT"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        $interfaces = Get-NetAdapter | Where-Object { $_.Status -eq "Up" }
        $domainIP = "{{ ansible_host }}"
        foreach ($if in $interfaces) {
          $ip = Get-NetIPAddress -InterfaceIndex $if.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if ($ip.IPAddress -eq $domainIP) { Write-Output "domain=$($if.Name)" }
          else { Write-Output "nat=$($if.Name)" }
        }
      register: win_adapter_detect
      changed_when: false

    - name: "[PREP] Set domain adapter DNS to domain DC"
      ansible.windows.win_dns_client:
        adapter_names: "{{ (win_adapter_detect.stdout_lines | select('match','^domain=') | first | split('=') | last) }}"
        ipv4_addresses:
          - "{{ '192.168.77.11' if 'mbr01' in inventory_hostname else '192.168.77.12' if 'mbr02' in inventory_hostname else '192.168.77.10' }}"

    - name: "[PREP] Remove dead default gateway from domain adapter"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        $domain = "{{ (win_adapter_detect.stdout_lines | select('match','^domain=') | first | split('=') | last) }}"
        try {
          $route = Get-NetRoute -InterfaceAlias $domain -DestinationPrefix "0.0.0.0/0" -ErrorAction SilentlyContinue
          if (-not $route) { Write-Output "OK: No dead gateway found"; exit 0 }
          Remove-NetRoute -InterfaceAlias $domain -DestinationPrefix "0.0.0.0/0" -Confirm:$false
          $verify = Get-NetRoute -InterfaceAlias $domain -DestinationPrefix "0.0.0.0/0" -ErrorAction SilentlyContinue
          if ($verify) { throw "Route still present" }
          Write-Output "APPLIED: Dead gateway removed"; exit 2
        } catch { Write-Output "FAILED: Gateway removal — $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1
