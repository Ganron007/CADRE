---
# TYPE: VERIFY-ONLY (rc=0=pass, rc=1=fail — checks IIS pool, shares, bait files)
# Layer 6: Member Services — Verify shares + bait, IIS app pool, VSC template

- name: "Verify IIS CertPotato app pool on mbr01"
  hosts: mbr01
  gather_facts: false
  tasks:
    - name: "[VULN][WT#29] Verify IIS app pool CADRE-CertPotato as NetworkService"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          Import-Module WebAdministration
          $pool = Get-Item "IIS:\AppPools\CADRE-CertPotato" -ErrorAction SilentlyContinue
          if ($pool) {
            $identity = (Get-ItemProperty "IIS:\AppPools\CADRE-CertPotato" -Name processModel).identityType
            if ($identity -eq 2 -or $identity -eq "NetworkService") { Write-Output "PASS: App pool exists as NetworkService"; exit 0 }
            Write-Output "FAIL: App pool exists but identity is $identity"; exit 1
          }
          Write-Output "FAIL: CADRE-CertPotato app pool not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "Verify SMB shares on mbr01"
  hosts: mbr01
  gather_facts: false
  tasks:
    - name: 'Verify C:\Shares\public directory'
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\public") { Write-Output "PASS: Directory exists"; exit 0 }
          Write-Output "FAIL: Directory not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'Verify C:\Shares\restricted directory'
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\restricted") { Write-Output "PASS: Directory exists"; exit 0 }
          Write-Output "FAIL: Directory not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify public share"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $share = Get-SmbShare -Name "public" -ErrorAction SilentlyContinue
          if ($share) { Write-Output "PASS: Share exists"; exit 0 }
          Write-Output "FAIL: Share not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify restricted share"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $share = Get-SmbShare -Name "restricted" -ErrorAction SilentlyContinue
          if ($share) { Write-Output "PASS: Share exists"; exit 0 }
          Write-Output "FAIL: Share not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify NTFS FullControl for analyst_cloud on restricted"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $acl = Get-Acl -Path "C:\Shares\restricted"
          $existing = $acl.Access | Where-Object { $_.IdentityReference.Value -eq "CADRE\analyst_cloud" -and $_.FileSystemRights -eq "FullControl" }
          if ($existing) { Write-Output "PASS: NTFS ACE exists"; exit 0 }
          Write-Output "FAIL: NTFS ACE not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify bait: cadre-handbook.txt (public)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\public\cadre-handbook.txt") { Write-Output "PASS: Bait file exists"; exit 0 }
          Write-Output "FAIL: Bait file not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify bait: incident-log.txt (public)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\public\incident-log.txt") { Write-Output "PASS: Bait file exists"; exit 0 }
          Write-Output "FAIL: Bait file not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "Verify SMB shares on mbr02"
  hosts: mbr02
  gather_facts: false
  tasks:
    - name: 'Verify C:\Shares\vault directory'
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\vault") { Write-Output "PASS: Directory exists"; exit 0 }
          Write-Output "FAIL: Directory not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'Verify vault share'
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $share = Get-SmbShare -Name "vault" -ErrorAction SilentlyContinue
          if ($share) { Write-Output "PASS: Share exists"; exit 0 }
          Write-Output "FAIL: Share not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify bait: naa-rotation-notice.txt (vault)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\vault\naa-rotation-notice.txt") { Write-Output "PASS: Bait file exists"; exit 0 }
          Write-Output "FAIL: Bait file not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[SHARE] Verify bait: sccm-recovery-key.txt (vault)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          if (Test-Path "C:\Shares\vault\sccm-recovery-key.txt") { Write-Output "PASS: Bait file exists"; exit 0 }
          Write-Output "FAIL: Bait file not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'SCCM — Verify svc_sccm is SCCM Full Administrator'
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $svc = Get-Service SMS_EXECUTIVE -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Output "SKIP: SCCM not installed"; exit 0 }
          $sid = ([System.Security.Principal.NTAccount]"RANGE\svc_sccm").Translate([System.Security.Principal.SecurityIdentifier]).Value
          $admin = Get-WmiObject -Namespace "root\SMS\site_CAD" -Class SMS_Admin -ErrorAction SilentlyContinue | Where-Object { $_.AdminSid -eq $sid }
          if ($admin) { Write-Output "PASS: svc_sccm is SCCM Full Administrator"; exit 0 }
          Write-Output "FAIL: svc_sccm is not an SCCM admin. Run 06-member-services.yml deploy."; exit 1
        } catch { Write-Output "FAIL: svc_sccm admin check error: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "VSC template verification — dc01"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[ADCS] VSC template CADRE-VSC published (verify)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $configNC = (Get-ADRootDSE).configurationNamingContext
          $tpl = Get-ADObject -Filter { Name -eq "CADRE-VSC" } -SearchBase "CN=Certificate Templates,CN=Public Key Services,CN=Services,$configNC" -ErrorAction SilentlyContinue
          if ($tpl) { Write-Output "PASS: CADRE-VSC template exists"; exit 0 }
          Write-Output "FAIL: CADRE-VSC template not found"; exit 1
        } catch { Write-Output "FAIL: VSC check error: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "H — Verify phishing setup on mbr01"
  hosts: mbr01
  gather_facts: false
  tasks:
    - name: 'H — Verify analyst_cloud in Remote Desktop Users'
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $group = [ADSI]"WinNT://./Remote Desktop Users"
          $member = $group.Members() | Where-Object { $_.GetType().InvokeMember("Name", 'GetProperty', $null, $_, $null) -eq "analyst_cloud" }
          if ($member) { Write-Output "PASS: analyst_cloud is in Remote Desktop Users"; exit 0 }
          Write-Output "FAIL: analyst_cloud not in Remote Desktop Users"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'H — Verify auto-logon for analyst_cloud'
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          $user = (Get-ItemProperty -Path $regPath -Name "DefaultUserName" -ErrorAction Stop).DefaultUserName
          $pass = (Get-ItemProperty -Path $regPath -Name "DefaultPassword" -ErrorAction Stop).DefaultPassword
          $domain = (Get-ItemProperty -Path $regPath -Name "DefaultDomainName" -ErrorAction Stop).DefaultDomainName
          $auto = (Get-ItemProperty -Path $regPath -Name "AutoAdminLogon" -ErrorAction Stop).AutoAdminLogon
          if ($user -eq "analyst_cloud" -and $pass -eq "Cl0ud_An@lyst!" -and $domain -eq "CADRE" -and $auto -eq "1") {
            Write-Output "PASS: auto-logon configured for analyst_cloud"; exit 0
          }
          Write-Output "FAIL: auto-logon values mismatch user=$user domain=$domain auto=$auto"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'H — Verify analyst_cloud Downloads directory'
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          if (Test-Path "C:\Users\analyst_cloud\Downloads") { Write-Output "PASS: Downloads directory exists"; exit 0 }
          Write-Output "FAIL: Downloads directory not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'H — Verify Tools directory'
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          if (Test-Path "C:\Tools") { Write-Output "PASS: Tools directory exists"; exit 0 }
          Write-Output "FAIL: Tools directory not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: 'H — Verify analyst_cloud has "Log on as a batch job" (scheduled-task persistence prerequisite)'
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $tmp = Join-Path $env:TEMP "cadre-secbatch.inf"
          secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
          $content = Get-Content $tmp -Raw
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue
          $sid = (New-Object System.Security.Principal.NTAccount("CADRE\analyst_cloud")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          if ($content -match 'SeBatchLogonRight\s*=\s*[^\r\n]*\*' + [regex]::Escape($sid)) {
            Write-Output "PASS: analyst_cloud has SeBatchLogonRight"; exit 0
          }
          Write-Output "FAIL: SeBatchLogonRight missing for analyst_cloud"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

