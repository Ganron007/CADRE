    - name: "[VERIFY][WT#33] SID filtering disabled on cadre.local trust (dc03)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $t = Get-ADTrust -Filter "Name -eq 'cadre.local'" -ErrorAction Stop
          if ($t.SIDFilteringQuarantined -eq $false) { Write-Output "PASS: SID filtering disabled on cadre.local trust (WT#33 attack surface)"; exit 0 }
          Write-Output "FAIL: SID filtering enabled (SIDFilteringQuarantined=$($t.SIDFilteringQuarantined)) — run 00-domain-deploy.yml to disable"; exit 1
        } catch { Write-Output "FAIL: SID filtering check error: $_"; exit 1 }

    - name: "[VERIFY][WT#33] Selective auth disabled on cadre.local trust (dc03)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $t = Get-ADTrust -Filter "Name -eq 'cadre.local'" -ErrorAction Stop
          if ($t.SelectiveAuthentication -eq $false) { Write-Output "PASS: Selective authentication disabled on cadre.local trust"; exit 0 }
          Write-Output "FAIL: Selective authentication enabled (SelectiveAuthentication=$($t.SelectiveAuthentication))"; exit 1
        } catch { Write-Output "FAIL: Selective auth check error: $_"; exit 1 }

    - name: "[VERIFY] Conditional forwarder cadre.local→192.168.77.10 [dns]"
      tags: [dns]
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $z = Get-DnsServerConditionalForwarderZone -Name "cadre.local" -ErrorAction Stop
          Write-Output "PASS: Conditional forwarder cadre.local exists -> $($z.MasterServers)"
          exit 0
        } catch { Write-Output "FAIL: Conditional forwarder cadre.local not found: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "Verify child.cadre.local domain"
  hosts: dc02
  gather_facts: false
  tasks:
    - name: "[VERIFY] child.cadre.local domain exists"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $d = Get-ADDomain -Identity child.cadre.local -ErrorAction Stop
          Write-Output "PASS: child.cadre.local found (DNS root: $($d.DNSRoot))"
          exit 0
        } catch { Write-Output "FAIL: child.cadre.local not found: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1
