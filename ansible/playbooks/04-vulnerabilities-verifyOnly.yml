---
# TYPE: VERIFY-ONLY (rc=0=pass, rc=1=fail — checks registry vulns, services, features)
# Layer 4: Vulnerabilities — Verify-only mode (read, never write)

- name: "Verify registry vulnerabilities on all DCs"
  hosts: root_dc:child_dc:external_dc
  gather_facts: false
  tasks:
    - name: "[VULN][WT#21] Verify NTLM outbound allowed"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0" -Name "RestrictSendingNTLMTraffic" -ErrorAction Stop).RestrictSendingNTLMTraffic
          if ($val -eq 0) { Write-Output "PASS: NTLM outbound allowed (RestrictSendingNTLMTraffic=0)"; exit 0 }
          Write-Output "FAIL: expected RestrictSendingNTLMTraffic=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#21] Verify NTLM incoming allowed"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters" -Name "RestrictNTLMInDomain" -ErrorAction Stop).RestrictNTLMInDomain
          if ($val -eq 0) { Write-Output "PASS: NTLM incoming allowed (RestrictNTLMInDomain=0)"; exit 0 }
          Write-Output "FAIL: expected RestrictNTLMInDomain=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Verify Print-Services feature installed"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $feature = Get-WindowsFeature -Name Print-Services -ErrorAction Stop
          if ($feature.Installed -eq $true) { Write-Output "PASS: Print-Services feature installed"; exit 0 }
          Write-Output "FAIL: Print-Services feature not installed"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Verify Print-Services feature installed"
      ansible.windows.win_shell: |
        try {
          $ErrorActionPreference = "Stop"
          $feat = Get-WindowsFeature -Name "Print-Services" -ErrorAction Stop
          if ($feat.InstallState -eq "Installed") { Write-Output "PASS: Print-Services feature installed"; exit 0 }
          Write-Output "FAIL: Print-Services feature not installed (state=$($feat.InstallState))"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#17] Verify Print Spooler enabled (auto)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $svc = Get-Service -Name "Spooler" -ErrorAction Stop
          if ($svc.StartType -eq "Automatic" -and $svc.Status -eq "Running") { Write-Output "PASS: Spooler is Automatic/Running"; exit 0 }
          Write-Output "FAIL: expected Spooler Automatic/Running got $($svc.StartType)/$($svc.Status)"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#18] Verify WebClient enabled (auto)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $svc = Get-Service -Name "WebClient" -ErrorAction Stop
          if ($svc.StartType -eq "Automatic" -and $svc.Status -eq "Running") { Write-Output "PASS: WebClient is Automatic/Running"; exit 0 }
          Write-Output "FAIL: expected WebClient Automatic/Running got $($svc.StartType)/$($svc.Status)"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#20] Verify FssAgent (ShadowCoerce) enabled (auto)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $svc = Get-Service -Name "FssAgent" -ErrorAction Stop
          if ($svc.StartType -eq "Automatic" -and $svc.Status -eq "Running") { Write-Output "PASS: FssAgent is Automatic/Running"; exit 0 }
          Write-Output "FAIL: expected FssAgent Automatic/Running got $($svc.StartType)/$($svc.Status)"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#18] Verify WebClient enabled (auto)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $svc = Get-Service -Name "WebClient" -ErrorAction Stop
          if ($svc.StartType -eq "Automatic" -and $svc.Status -eq "Running") { Write-Output "PASS: WebClient is Automatic/Running"; exit 0 }
          Write-Output "FAIL: expected WebClient Automatic/Running got $($svc.StartType)/$($svc.Status)"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#18] Verify WebDAV-Redirector feature installed"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $f = Get-WindowsFeature -Name "WebDAV-Redirector"
          if ($f.Installed) { Write-Output "PASS: WebDAV-Redirector feature installed"; exit 0 }
          Write-Output "FAIL: WebDAV-Redirector feature not installed"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#19] Verify DFS Namespace feature installed (DFSCoerce)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $f = Get-WindowsFeature -Name "FS-DFS-Namespace"
          if ($f.Installed) { Write-Output "PASS: FS-DFS-Namespace feature installed"; exit 0 }
          Write-Output "FAIL: FS-DFS-Namespace feature not installed"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#20] Verify FSRVP feature installed (ShadowCoerce)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $f = Get-WindowsFeature -Name "FS-VSS-Agent"
          if ($f.Installed) { Write-Output "PASS: FS-VSS-Agent feature installed"; exit 0 }
          Write-Output "FAIL: FS-VSS-Agent feature not installed"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#20] Verify FssAgent (ShadowCoerce) enabled (auto)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $svc = Get-Service -Name "FssAgent" -ErrorAction Stop
          if ($svc.StartType -eq "Automatic" -and $svc.Status -eq "Running") { Write-Output "PASS: FssAgent is Automatic/Running"; exit 0 }
          Write-Output "FAIL: expected FssAgent Automatic/Running got $($svc.StartType)/$($svc.Status)"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify EFS service is available for PetitPotam"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $svc = Get-Service -Name "EFS" -ErrorAction Stop
          if ($svc.StartType -ne "Disabled") {
              Write-Output "PASS: EFS exists and is ready (StartType: $($svc.StartType))"; exit 0
          }
          Write-Output "FAIL: EFS is explicitly Disabled and blocked"; exit 1
        } catch {
          Write-Output "FAIL: EFS service not found — $_"; exit 1
        }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#21] Verify LDAP signing NOT required (relay target)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters" -Name "LDAPServerIntegrity" -ErrorAction Stop).LDAPServerIntegrity
          if ($val -eq 1) { Write-Output "PASS: LDAP signing =1 (not required)"; exit 0 }
          Write-Output "FAIL: expected LDAPServerIntegrity=1 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#59] Verify ESC10 — StrongCertificateBindingEnforcement=0 on Kdc"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Kdc" -Name "StrongCertificateBindingEnforcement" -ErrorAction Stop).StrongCertificateBindingEnforcement
          if ($val -eq 0) { Write-Output "PASS: StrongCertificateBindingEnforcement=0"; exit 0 }
          Write-Output "FAIL: expected StrongCertificateBindingEnforcement=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#59] Verify ESC10 — CertificateMappingMethods=31 on Schannel"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Schannel" -Name "CertificateMappingMethods" -ErrorAction Stop).CertificateMappingMethods
          if ($val -eq 31) { Write-Output "PASS: CertificateMappingMethods=31"; exit 0 }
          Write-Output "FAIL: expected CertificateMappingMethods=31 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

# Mirror 04-vulnerabilities.yml — ws01 keeps MDE/Defender; do not assert WDigest/CG/Defender-off.
- name: "Verify registry vulnerabilities on Windows VMs (exclude ws01 MDE target)"
  hosts: windows_servers:!ws01
  gather_facts: false
  tasks:
    - name: "[VULN] Verify WDigest credential caching enabled"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest" -Name "UseLogonCredential" -ErrorAction Stop).UseLogonCredential
          if ($val -eq 1) { Write-Output "PASS: WDigest UseLogonCredential=1"; exit 0 }
          Write-Output "FAIL: expected UseLogonCredential=1 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify Credential Guard (LsaCfgFlags) disabled"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "LsaCfgFlags" -ErrorAction Stop).LsaCfgFlags
          if ($val -eq 0) { Write-Output "PASS: Credential Guard disabled (LsaCfgFlags=0)"; exit 0 }
          Write-Output "FAIL: expected LsaCfgFlags=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify Credential Guard VBS (EnableVBS) disabled"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard" -Name "EnableVirtualizationBasedSecurity" -ErrorAction Stop).EnableVirtualizationBasedSecurity
          if ($val -eq 0) { Write-Output "PASS: VBS disabled (EnableVirtualizationBasedSecurity=0)"; exit 0 }
          Write-Output "FAIL: expected EnableVirtualizationBasedSecurity=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify LSA Protection (RunAsPPL) removed"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Lsa" -Name "RunAsPPL" -ErrorAction Stop
          Write-Output "FAIL: RunAsPPL exists (value $($val.RunAsPPL))"; exit 1
        } catch {
          Write-Output "PASS: RunAsPPL does not exist"; exit 0
        }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#34] Verify Restricted Admin Mode (RDP) enabled"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Lsa" -Name "DisableRestrictedAdmin" -ErrorAction Stop).DisableRestrictedAdmin
          if ($val -eq 0) { Write-Output "PASS: Restricted Admin Mode enabled (DisableRestrictedAdmin=0)"; exit 0 }
          Write-Output "FAIL: expected DisableRestrictedAdmin=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#H] Verify RDP enabled (fDenyTSConnections=0)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $val = (Get-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -ErrorAction Stop).fDenyTSConnections
          if ($val -eq 0) { Write-Output "PASS: RDP enabled (fDenyTSConnections=0)"; exit 0 }
          Write-Output "FAIL: expected fDenyTSConnections=0 got $val"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN][WT#H] Verify RDP firewall rule enabled"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $rule = Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          $enabled = $rule | Where-Object { $_.Enabled -eq $true }
          if ($enabled) { Write-Output "PASS: RDP firewall rule enabled"; exit 0 }
          Write-Output "FAIL: RDP firewall rule not enabled"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify Windows Firewall profiles disabled (lab servers)"
      ansible.windows.win_shell: |
        try {
          $ErrorActionPreference = "Stop"
          $still = Get-NetFirewallProfile | Where-Object { $_.Enabled -eq $true }
          if ($still) {
            Write-Output ("FAIL: Enabled profiles: " + ($still.Name -join ','))
            exit 1
          }
          Write-Output "PASS: All firewall profiles disabled"
          exit 0
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[VULN] Verify Windows Defender fully disabled"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        
        # Check 1: Tamper Protection off (critical — Server 2025 blocks all changes if ON)
        $tpPath = "HKLM:\SOFTWARE\Microsoft\Windows Defender\Features"
        $tp = Get-ItemProperty -Path $tpPath -Name "TamperProtection" -ErrorAction SilentlyContinue
        if ($tp.TamperProtection -ne 0) { Write-Output "FAIL: TamperProtection=$($tp.TamperProtection)"; exit 1 }
        
        # Method 2: Check the AntiSpyware policy registry
        $polPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender"
        $pol = Get-ItemProperty -Path $polPath -Name "DisableAntiSpyware" -ErrorAction SilentlyContinue
        if ($pol.DisableAntiSpyware -eq 1) {
            Write-Output "PASS: Defender disabled (All registry keys confirmed)"; exit 0
        }
        
        # Method 3: Try the cmdlet and catch the "service dead" exception
        try {
          $mp = Get-MpPreference
          if ($mp.DisableRealtimeMonitoring -eq $true) { 
              Write-Output "PASS: Defender disabled (Cmdlet confirmed)"; exit 0 
          }
        } catch {
          if ($_ -match "0x800106ba") {
              Write-Output "PASS: Defender service disabled entirely (0x800106ba)"; exit 0
          }
        }
        
        Write-Output "FAIL: Defender not fully disabled"
        exit 1
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "Verify SMB signing disabled on mbr02"
  hosts: mbr02
  gather_facts: false
  tasks:
    - name: "[VULN][WT#22] Verify SMB signing disabled on mbr02 (relay target)"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $path = "HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters"
          $req = (Get-ItemProperty -Path $path -Name "RequireSecuritySignature" -ErrorAction SilentlyContinue).RequireSecuritySignature
          $en = (Get-ItemProperty -Path $path -Name "EnableSecuritySignature" -ErrorAction SilentlyContinue).EnableSecuritySignature
          if ($req -eq 0 -and $en -eq 0) { Write-Output "PASS: SMB signing disabled (Req=0, En=0)"; exit 0 }
          Write-Output "FAIL: expected Req=0/En=0 got Req=$req/En=$en"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

