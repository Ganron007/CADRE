# ws01 DNS verify lives in 17-ws01-deploy-verifyOnly.yml
- name: "DNS fix — adapter DNS + gateway verify (exclude ws01)"
  hosts: windows_servers:!ws01
  gather_facts: false
  tasks:
    - name: "Detect adapters — domain (vmnet2) vs NAT"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        $interfaces = Get-NetAdapter | Where-Object { $_.Status -eq "Up" }
        $domainIP = "{{ ansible_host }}"
        foreach ($if in $interfaces) {
          $ip = Get-NetIPAddress -InterfaceIndex $if.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue
          if ($ip.IPAddress -eq $domainIP) { Write-Output "domain=$($if.Name)" }
          else { Write-Output "nat=$($if.Name)" }
        }
      register: win_adapter_detect
      changed_when: false

    - name: "[PREP] Verify domain adapter DNS points to domain DC"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $domain = "{{ (win_adapter_detect.stdout_lines | select('match','^domain=') | first | split('=') | last) }}"
          $dns = (Get-DnsClientServerAddress -InterfaceAlias $domain -AddressFamily IPv4).ServerAddresses
          $expected = "{{ '192.168.77.11' if 'mbr01' in inventory_hostname else '192.168.77.12' if 'mbr02' in inventory_hostname else '192.168.77.10' }}"
          if ($dns -contains $expected) { Write-Output "PASS: DNS set to $expected on $domain"; exit 0 }
          Write-Output "FAIL: expected DNS $expected on $domain, got $($dns -join ',')"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[PREP] Verify no dead default gateway on domain adapter"
      ansible.windows.win_shell: |
        try {
        $ErrorActionPreference = "Stop"
          $domain = "{{ (win_adapter_detect.stdout_lines | select('match','^domain=') | first | split('=') | last) }}"
          $route = Get-NetRoute -InterfaceAlias $domain -DestinationPrefix "0.0.0.0/0" -ErrorAction SilentlyContinue
          if (-not $route) { Write-Output "PASS: No dead gateway on $domain"; exit 0 }
          Write-Output "FAIL: Dead gateway still present on $domain (NextHop=$($route.NextHop))"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1
