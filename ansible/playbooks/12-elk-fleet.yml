---
# TYPE: DEPLOY (rc=0=skip, rc=2=applied+verified, rc=1=fail)
# ============================================================
# elk-fleet extension — Elastic 9.x + Kibana + Fleet Server
# + Fleet policies (CADRE-All, CADRE-Linux, CADRE-Monitor)
# + Elastic Defend (detect mode) + Windows/System/Osquery/Z/S integrations
# + Threat Intel (Abuse.ch) + 23 seed detection rules
# + Elastic Agent enrollment on all 6 target VMs
# ============================================================

- name: "Play 1 — Install ES + Kibana + Fleet Server on elk VM"
  hosts: elk
  gather_facts: true
  become: yes
  vars:
    elk_major: "9"
    elastic_password: "elastic_CADRE_2026!"
    es_port: 9200
    kibana_port: 5601
    fleet_port: 8220
    elastic_agent_version: "9.0.0"
    kibana_service_token: ""

  tasks:
    - name: Read persisted elastic password if available
      ansible.builtin.slurp:
        src: /home/vagrant/es-generated-pw.txt
      register: es_pw_file
      ignore_errors: true

    - name: Override elastic_password from file
      ansible.builtin.set_fact:
        elastic_password: "{{ (es_pw_file.content | b64decode).strip() }}"
      when: es_pw_file is succeeded

    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
          - unzip
          - wget
          - jq
        state: present
        update_cache: true

    - name: Add Elastic GPG key
      ansible.builtin.apt_key:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present

    - name: Add Elastic APT repository
      ansible.builtin.apt_repository:
        repo: "deb https://artifacts.elastic.co/packages/{{ elk_major }}.x/apt stable main"
        state: present
        update_cache: true

    - name: Install Elasticsearch + Kibana
      ansible.builtin.apt:
        name:
          - elasticsearch
          - kibana
        state: present

    - name: Get installed Elasticsearch version for same-version elastic-agent
      ansible.builtin.shell: |
        dpkg-query -W -f='${Version}' elasticsearch | cut -d- -f1
      register: es_ver_raw
      changed_when: false

    - name: Set elastic-agent version fact
      ansible.builtin.set_fact:
        elastic_agent_dl_ver: "{{ es_ver_raw.stdout | default('9.4.1') }}"

    - name: Remove apt-installed elastic-agent (blocks Fleet Server enrollment)
      ansible.builtin.systemd:
        name: elastic-agent
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Purge elastic-agent apt package
      ansible.builtin.apt:
        name: elastic-agent
        state: absent
        purge: true

    - name: Clean up old elastic-agent data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/elastic-agent
        - /var/lib/elastic-agent
        - /var/log/elastic-agent

    - name: Download elastic-agent tarball for Fleet Server
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_dl_ver }}-linux-x86_64.tar.gz"
        dest: "/tmp/elastic-agent-{{ elastic_agent_dl_ver }}-linux-x86_64.tar.gz"
        mode: "0644"
      register: agent_dl

    - name: Extract elastic-agent tarball
      ansible.builtin.unarchive:
        src: "/tmp/elastic-agent-{{ elastic_agent_dl_ver }}-linux-x86_64.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/elastic-agent-{{ elastic_agent_dl_ver }}-linux-x86_64"

    - name: Configure Elasticsearch
      ansible.builtin.copy:
        content: |
          cluster.name: cadre-elk
          node.name: elk
          path.data: /var/lib/elasticsearch
          path.logs: /var/log/elasticsearch
          network.host: 0.0.0.0
          http.port: {{ es_port }}
          discovery.type: single-node
          xpack.security.enabled: true
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          xpack.security.authc.api_key.enabled: true
        dest: /etc/elasticsearch/elasticsearch.yml
        mode: "0644"

    - name: Start Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for Elasticsearch port
      ansible.builtin.wait_for:
        port: "{{ es_port }}"
        delay: 20
        timeout: 180

    - name: Reset elastic password and capture it
      ansible.builtin.shell: |
        /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -b -s
      register: es_pw_reset
      ignore_errors: true

    - name: Store the elastic password for subsequent API calls
      ansible.builtin.set_fact:
        elastic_password: "{{ es_pw_reset.stdout_lines[0] }}"
      when: es_pw_reset is succeeded and es_pw_reset.stdout_lines | length > 0

    - name: Persist elastic password to file for cross-run access
      ansible.builtin.copy:
        content: "{{ elastic_password }}"
        dest: /home/vagrant/es-generated-pw.txt
        mode: "0644"
      when: es_pw_reset is succeeded and es_pw_reset.stdout_lines | length > 0

    - name: Create GeoIP database directory
      ansible.builtin.file:
        path: /etc/elasticsearch/ingest-geoip
        state: directory
        mode: "0755"

    - name: Download GeoLite2-City database for GeoIP enrichment
      ansible.builtin.get_url:
        url: https://github.com/P3TERX/GeoLite.mmdb/releases/download/2026.05.16/GeoLite2-City.mmdb
        dest: /etc/elasticsearch/ingest-geoip/GeoLite2-City.mmdb
        mode: "0644"

    - name: Generate Kibana service account token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_security/service/elastic/kibana/credential/token"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 409]
      register: kibana_token_resp

    - name: Store Kibana service token as fact
      ansible.builtin.set_fact:
        kibana_service_token: "{{ kibana_token_resp.json.token.value | default('') }}"
      when: kibana_token_resp.status == 200

    - name: Configure Kibana
      ansible.builtin.copy:
        content: |
          server.port: {{ kibana_port }}
          server.host: "0.0.0.0"
          server.publicBaseUrl: "http://192.168.77.50:{{ kibana_port }}"
          elasticsearch.hosts: ["http://192.168.77.50:{{ es_port }}"]
          elasticsearch.serviceAccountToken: "{{ kibana_service_token }}"
          xpack.encryptedSavedObjects.encryptionKey: "cadre-elk-encryption-key-2026-cadre"
          xpack.fleet.agents.elasticsearch.hosts: ["http://192.168.77.50:{{ es_port }}"]
          xpack.fleet.agents.fleet_server.hosts: ["https://192.168.77.50:{{ fleet_port }}"]
          xpack.fleet.packages:
            - name: system
              version: latest
            - name: windows
              version: latest
            - name: endpoint
              version: latest
            - name: zeek
              version: latest
            - name: suricata
              version: latest
        dest: /etc/kibana/kibana.yml
        mode: "0644"

    - name: Start Kibana
      ansible.builtin.systemd:
        name: kibana
        state: started
        enabled: true

    - name: Wait for Kibana
      ansible.builtin.wait_for:
        port: "{{ kibana_port }}"
        delay: 15
        timeout: 180

    - name: Wait for Kibana to be ready (API responds)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/status"
        method: GET
        status_code: [200, 503]
      register: kibana_status
      retries: 30
      delay: 10
      until: kibana_status.status == 200

    - name: Create GeoIP ingest pipeline for source.ip + destination.ip
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_ingest/pipeline/cadre-geoip"
        method: PUT
        body_format: json
        body:
          description: "GeoIP enrichment from GeoLite2-City"
          processors:
            - geoip:
                field: source.ip
                target_field: source.geo
                database_file: GeoLite2-City.mmdb
                ignore_missing: true
            - geoip:
                field: destination.ip
                target_field: destination.geo
                database_file: GeoLite2-City.mmdb
                ignore_missing: true
            - geoip:
                field: client.ip
                target_field: client.geo
                database_file: GeoLite2-City.mmdb
                ignore_missing: true
            - geoip:
                field: server.ip
                target_field: server.geo
                database_file: GeoLite2-City.mmdb
                ignore_missing: true
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        status_code: [200, 409]
      register: geoip_pipeline
      ignore_errors: true

    - name: Apply GeoIP pipeline to ECK index templates
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_index_template/logs-windows.geoip"
        method: PUT
        body_format: json
        body:
          index_patterns:
            - "logs-windows.*-*"
            - "logs-auditd.*-*"
            - "logs-system.*-*"
            - "logs-zeek.*-*"
            - "logs-osquery.*-*"
            - "logs-mssql.*-*"
            - "logs-podman.*-*"
            - "logs-entra.*-*"
            - "logs-azure.*-*"
            - "logs-m365.*-*"
          template:
            settings:
              index.default_pipeline: cadre-geoip
          priority: 50
          _meta:
            description: "CADRE GeoIP enrichment template — applies cadre-geoip pipeline to all indices"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        status_code: [200, 409]
      ignore_errors: true

    - name: Create ES ILM policies for index lifecycle management
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_ilm/policy/{{ item.name }}"
        method: PUT
        body_format: json
        body: "{{ item.body }}"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        status_code: [200, 409]
      loop:
        - name: cadre-3d-retain
          body:
            policy:
              phases:
                hot:
                  min_age: "0d"
                  actions:
                    rollover:
                      max_age: "1d"
                      max_size: "10gb"
                delete:
                  min_age: "7d"
                  actions:
                    delete: {}

    - name: Apply ILM policies to @custom component templates (Fleet-managed indices)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_component_template/{{ item.name }}"
        method: PUT
        body_format: json
        body:
          template:
            settings:
              index.lifecycle.name: "{{ item.ilms }}"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        status_code: [200, 409]
      loop:
        - { name: "logs@custom",                ilms: "cadre-3d-retain" }
        - { name: "metrics@custom",             ilms: "cadre-3d-retain" }
        - { name: "logs-windows.forwarded@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-windows.sysmon_operational@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-windows.powershell@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-windows.powershell_operational@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-system.security@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-system.application@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-system.syslog@custom",  ilms: "cadre-3d-retain" }
        - { name: "logs-system.auth@custom",    ilms: "cadre-3d-retain" }
        - { name: "auditd@custom",              ilms: "cadre-3d-retain" }
        - { name: "logs-auditd.log@custom",     ilms: "cadre-3d-retain" }
        - { name: "microsoft_sqlserver@custom", ilms: "cadre-3d-retain" }
        - { name: "logs-mssql.log@custom",      ilms: "cadre-3d-retain" }
        - { name: "system@custom",              ilms: "cadre-3d-retain" }
        - { name: "logs-osquery_manager.result@custom", ilms: "cadre-3d-retain" }
      ignore_errors: true

    - name: Apply ILM to non-Fleet index templates
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_index_template/{{ item.name }}"
        method: PUT
        body_format: json
        body:
          index_patterns: "{{ item.patterns }}"
          priority: 50
          template:
            settings:
              index.lifecycle.name: "{{ item.ilms }}"
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
        status_code: [200, 409]
      loop:
        - { name: "ilmlogs-zeek",             patterns: ["logs-zeek.*-*"],            ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-suricata",         patterns: ["logs-suricata-*"],          ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-endpoint-alerts",  patterns: ["logs-endpoint.alerts-*"],   ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-alerts-security",  patterns: [".alerts-security.*"],       ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-sysmon-linux",     patterns: ["logs-sysmon_linux.log-*"],     ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-podman",           patterns: ["logs-podman-*"],            ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-sssd",             patterns: ["logs-sssd-*"],              ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-mssql-audit",     patterns: ["logs-mssql.audit-*"],       ilms: "cadre-3d-retain" }
        - { name: "ilmlogs-osquery",         patterns: ["logs-osquery_manager.result-*"], ilms: "cadre-3d-retain" }
      ignore_errors: true

    - name: Check if Fleet Server is already enrolled
      ansible.builtin.stat:
        path: /etc/elastic-agent/fleet-server.yml
      register: fleet_server_stat

    - name: Create Fleet data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/elastic-agent
        - /var/lib/elastic-agent
        - /var/log/elastic-agent

    - name: Initialize Fleet in Kibana
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/setup"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        status_code: [200, 409]
      register: fleet_setup_resp
      when: not fleet_server_stat.stat.exists

    - name: Create Fleet Server policy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: fleet-server-policy
          namespace: default
          description: "Default Fleet Server policy"
          is_default_fleet_server: true
          has_fleet_server: true
          monitoring_enabled: ["logs", "metrics"]
        status_code: [200, 409]
      register: fs_policy_resp
      when: not fleet_server_stat.stat.exists

    - name: Generate Fleet Server service token
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ es_port }}/_security/service/elastic/fleet-server/credential/token"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        status_code: [200, 409]
      register: fleet_token_resp
      when: not fleet_server_stat.stat.exists

    - name: Extract Fleet Server service token
      ansible.builtin.set_fact:
        fleet_server_token: "{{ fleet_token_resp.json.token.value | default('') }}"
      when: not fleet_server_stat.stat.exists

    - name: Enroll Fleet Server on this host
      ansible.builtin.shell: |
        /opt/elastic-agent-{{ elastic_agent_dl_ver }}-linux-x86_64/elastic-agent install \
          --fleet-server-es=http://127.0.0.1:{{ es_port }} \
          --fleet-server-service-token={{ fleet_server_token }} \
          --fleet-server-port={{ fleet_port }} \
          --fleet-server-policy=fleet-server-policy \
          --non-interactive \
          --force
      args:
        creates: /etc/elastic-agent/fleet-server.yml
      when: not fleet_server_stat.stat.exists
      register: fleet_enroll
      failed_when: false
      ignore_errors: true

    - name: Wait for Fleet Server to start listening
      ansible.builtin.wait_for:
        host: "192.168.77.50"
        port: "{{ fleet_port }}"
        delay: 15
        timeout: 180

    - name: Wait for Fleet API to be ready in Kibana
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        status_code: [200, 503]
      register: fleet_api
      retries: 30
      delay: 10
      until: fleet_api.status == 200

- name: "Play 2 — Fleet policies + integrations + detection rules"
  hosts: elk
  gather_facts: false
  vars:
    kibana_port: 5601
  tasks:
    - name: Read persisted elastic password
      ansible.builtin.slurp:
        src: /home/vagrant/es-generated-pw.txt
      register: es_pw_file2
      ignore_errors: true

    - name: Override elastic_password from file
      ansible.builtin.set_fact:
        elastic_password: "{{ (es_pw_file2.content | b64decode).strip() }}"
      when: es_pw_file2 is succeeded

    - name: Create CADRE-All Fleet policy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: CADRE-All
          namespace: default
          description: "Windows VMs + linux01 — host telemetry + Elastic Defend + Sysmon + auditd"
          monitoring_enabled: ["logs", "metrics"]
        status_code: [200, 409]
      register: p1

    - name: Create CADRE-Monitor Fleet policy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: CADRE-Monitor
          namespace: default
          description: "Monitor VM — Zeek + Suricata + System"
          monitoring_enabled: ["logs", "metrics"]
        status_code: [200, 409]
      register: p2

    - name: Create CADRE-Linux Fleet policy
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body:
          name: CADRE-Linux
          namespace: default
          description: "Linux VMs — osquery + auditd + MSSQL + Sysmon + System"
          monitoring_enabled: ["logs", "metrics"]
        status_code: [200, 409]
      register: p3

    - name: Fetch all Fleet policies to resolve IDs
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/agent_policies"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        status_code: 200
      register: policies

    - name: Set policy IDs
      ansible.builtin.set_fact:
        cadre_all: "{{ (policies.json['items'] | selectattr('name', 'equalto', 'CADRE-All') | first) }}"
        cadre_mon: "{{ (policies.json['items'] | selectattr('name', 'equalto', 'CADRE-Monitor') | first) }}"
        cadre_linux: "{{ (policies.json['items'] | selectattr('name', 'equalto', 'CADRE-Linux') | first) }}"

    - name: Add System integration to CADRE-All (security logs + metrics)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        body_format: json
        body:
          name: system-cadre-all
          policy_id: "{{ cadre_all.id }}"
          package:
            name: system
            version: 2.18.0
          inputs:
            - type: system/metrics
              enabled: true
              streams:
                - id: sys-cpu
                  data_stream:
                    type: metrics
                    dataset: system.cpu
                  enabled: true
                  vars:
                    period:
                      value: "10s"
                    cpu.metrics:
                      value: ["percentages"]
                - id: sys-memory
                  data_stream:
                    type: metrics
                    dataset: system.memory
                  enabled: true
                  vars:
                    period:
                      value: "10s"
                - id: sys-network
                  data_stream:
                    type: metrics
                    dataset: system.network
                  enabled: true
                  vars:
                    period:
                      value: "10s"
            - type: winlog
              enabled: true
              streams:
                - id: sys-sec
                  data_stream:
                    type: logs
                    dataset: system.security
                  enabled: true
                  vars:
                    preserve_original_event:
                      value: false
        status_code: [200, 409]
      ignore_errors: true

    - name: Add Windows integration to CADRE-All (sysmon + powershell)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        body_format: json
        body:
          name: windows-cadre-all
          policy_id: "{{ cadre_all.id }}"
          package:
            name: windows
            version: 3.8.3
          inputs:
            - type: winlog
              enabled: true
              streams:
                - id: win-sec
                  data_stream:
                    type: logs
                    dataset: windows.forwarded
                  enabled: true
                  vars:
                    preserve_original_event:
                      value: false
                - id: win-sysmon
                  data_stream:
                    type: logs
                    dataset: windows.sysmon_operational
                  enabled: true
                  vars:
                    preserve_original_event:
                      value: false
                - id: win-powershell
                  data_stream:
                    type: logs
                    dataset: windows.powershell
                  enabled: true
                  vars:
                    preserve_original_event:
                      value: false
                    event_id:
                      value: "400, 403, 600, 800"
                - id: win-powershell-op
                  data_stream:
                    type: logs
                    dataset: windows.powershell_operational
                  enabled: true
                  vars:
                    preserve_original_event:
                      value: false
                    event_id:
                      value: "4103, 4104, 4105, 4106"
        status_code: [200, 409]
      ignore_errors: true

    - name: Add Elastic Defend to CADRE-All (DETECT mode)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
