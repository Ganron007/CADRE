          interval: 5m
          from: now-360s
        - rule_id: cadre-l13-pam-change
          name: "L13 — PAM Configuration Change"
          description: "Write to /etc/pam.d/ outside package manager process — backdoor PAM module"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:pam_config"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "persistence", "T1556.003"]
