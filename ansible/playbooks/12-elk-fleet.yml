        - rule_id: cadre-l12-authorized-keys
          name: "L12 — Authorized Keys Modified"
          description: "SSH authorized_keys file written outside provisioning window"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.name:*authorized_keys*"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "persistence", "T1098.004"]
