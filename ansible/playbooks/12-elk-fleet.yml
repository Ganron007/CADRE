    - name: Add Osquery Manager to CADRE-Linux (2 packs — SUID + recent-login)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/fleet/package_policies"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        body_format: json
        body:
          name: osquery-linux-1
          policy_id: "{{ cadre_linux.id }}"
          package:
            name: osquery_manager
            version: 1.28.1
          inputs:
            - type: osquery
              enabled: true
              streams:
                - enabled: true
                  data_stream:
                    type: logs
                    dataset: osquery_manager.action.responses
                  vars:
                    query:
                      type: text
                - enabled: true
                  data_stream:
                    type: logs
                    dataset: osquery_manager.result
                  vars:
                    query:
                      type: text
              config:
                osquery:
                  value:
                    packs:
                      default--cadre-linux-pack-suid:
                        shard: 100
                        queries:
                          suid_bin:
                            interval: 300
                            query: "SELECT path, username, groupname, permissions FROM suid_bins;"
                            platform: linux
                          proc_inmemory:
                            interval: 300
                            query: "SELECT pid, name, path, cmdline, uid, parent FROM processes WHERE on_disk = 0;"
                            platform: linux
                          listening_ports_external:
                            interval: 300
                            query: "SELECT pid, port, protocol, family, address, p.name FROM listening_ports lp JOIN processes p USING (pid) WHERE address NOT IN ('127.0.0.1','::1','0.0.0.0','::');"
                            platform: linux
                          kernel_modules:
                            interval: 300
                            query: "SELECT name, size, used_by, status, address FROM kernel_modules;"
                            platform: linux
                          login_users:
                            interval: 300
                            query: "SELECT uid, gid, username, description, directory, shell FROM users WHERE shell NOT IN ('/usr/sbin/nologin','/bin/false','/usr/bin/false','/sbin/nologin');"
                            platform: linux
                          authorized_keys:
                            interval: 300
                            query: "SELECT a.uid, u.username, a.key_file, a.algorithm, a.comment FROM users u JOIN authorized_keys a ON u.uid = a.uid;"
                            platform: linux
                      default--cadre-linux-pack-recent-login:
                        shard: 100
                        queries:
                          deb_packages:
                            interval: 1800
                            query: "SELECT name, version, source, size, arch, revision FROM deb_packages;"
                            platform: linux
                          recent_logins:
                            interval: 1800
                            query: "SELECT username, tty, host, time, type FROM last WHERE time > (strftime('%s','now') - 1800);"
                            platform: linux
        status_code: [200, 409]
      ignore_errors: true

    - name: Create seed detection rules
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ kibana_port }}/api/detection_engine/rules"
        method: POST
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
        body_format: json
        body: "{{ item }}"
        status_code: [200, 409]
      loop:
        # NOTE: cadre-001 (RC4 Kerberoast) removed — RC4 is non-viable on Server 2025
        # (KDC returns KDC_ERR_ETYPE_NOSUPP). The real Kerberoast network signature is
        # caught by cadre-007-zeek-kerberoast (WT#002/033). Slot reserved for a future
        # initial-access detection.
        - rule_id: cadre-002-asrep-roast
          name: "AS-REP Roasting"
          description: "Detects AS-REP Roasting — Kerberos AS-REQ without pre-authentication"
          type: query
          language: kuery
          index: ["logs-system.security-*"]
          query: "event.code:4768 AND winlog.event_data.PreAuthType:0"
          risk_score: 73
          severity: high
          tags: ["CADRE", "credential_access", "T1558.004"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-003-dcsync
          name: "DCSync Detected"
          description: "Detects DCSync — DS-Replication-Get-Changes extended right"
          type: query
          language: kuery
          index: ["logs-system.security-*"]
          query: "event.code:4662 AND winlog.event_data.AccessMask:*0x100* AND winlog.event_data.Properties:*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "credential_access", "T1003.006"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-004-suspicious-proc
          name: "Suspicious Sysmon Process"
          description: "Attack tools via Sysmon EID 1 — Mimikatz/Rubeus/Certify patterns"
          type: query
          language: kuery
          index: ["logs-windows.sysmon_operational-*"]
          query: "event.code:1 AND process.command_line:(*mimikatz* OR *Rubeus* OR *Certify* OR *SharpKatz* OR *SafetyKatz* OR *Procdump64* OR *secretsdump* OR *Invoke-Mimikatz*)"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "execution", "T1059"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-005-adcs-tamper
          name: "ADCS Template Modification"
          description: "Certutil CA configuration change — ESC attack precursor (Sysmon EID 1)"
          type: query
          language: kuery
          index: ["logs-windows.sysmon_operational-*"]
          query: "event.code:1 AND process.command_line:(*certutil* AND *setreg* AND *CA*)"
          risk_score: 73
          severity: high
          tags: ["CADRE", "privilege_escalation", "T1649"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-006-ntlm-relay
          name: "NTLM Relay — Multi-Host Logon"
          description: "Rapid NTLM logons from same source across multiple hosts"
          type: threshold
          language: kuery
          index: ["logs-system.security-*"]
          query: "event.code:4624 AND winlog.event_data.LogonType:3 AND winlog.event_data.AuthenticationPackageName:NTLM"
          threshold:
            field: ["source.ip"]
            value: 3
            cardinality:
              - field: "winlog.computer_name"
                value: 2
          risk_score: 73
          severity: high
          tags: ["CADRE", "lateral_movement", "T1557.001"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-007-zeek-kerberoast
          name: "Kerberoast Attempt (Zeek)"
          description: "Network signature of a Kerberoasting attempt (WT#002/033) — a TGS-REQ whose encryption downgrade the Server 2025 KDC rejects (KDC_ERR_ETYPE_NOSUPP), observed on the Zeek sensor"
          type: query
          language: kuery
          index: ["logs-zeek.kerberos-*"]
          query: "zeek.kerberos.request_type:TGS AND zeek.kerberos.error.msg:KDC_ERR_ETYPE_NOSUPP"
          risk_score: 73
          severity: high
          tags: ["CADRE", "credential_access", "T1558.003", "zeek"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-008-gmsa-extract
          name: "gMSA Password Extraction"
          description: "Detects gMSA password extraction — ReadProperty on msDS-ManagedPassword"
          type: query
          language: kuery
          index: ["logs-system.security-*"]
          query: "event.code:4662 AND winlog.event_data.ObjectServer:DS AND winlog.event_data.Properties:*e48d0154*"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "credential_access", "T1552.005"]
          enabled: true
          interval: 5m
          from: now-360s
        # --- Linux detection rules (L01-L15) ---
        - rule_id: cadre-l01-keytab-read
          name: "L01 — Keytab File Read"
          description: "Read of /etc/krb5.keytab or mssql.keytab by non-system process"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:(keytab_access OR mssql_keytab)"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "credential_access", "T1558.003"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l02-realm-change
          name: "L02 — Realm Join/Leave"
          description: "Execution of realm leave or realm join"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:realmd_exec"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "defense_evasion", "T1484"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l03-sssd-cache
          name: "L03 — SSSD Cache Read"
          description: "Read of SSSD credential cache database — potential credential theft"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:(sssd_db OR sssd_secrets)"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "credential_access", "T1003.008"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l04-suid-binary
          name: "L04 — New SUID Binary (osquery)"
          description: "New SUID binary detected via osquery — GTFOBins persistence"
          type: query
          language: kuery
          index: ["logs-osquery_manager.result-*"]
          query: "event.module:osquery_manager AND osquery.path:/tmp/suid_bash"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "privilege_escalation", "T1548.001"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l05-kernel-module
          name: "L05 — Kernel Module Load"
          description: "Kernel module loaded via init_module or finit_module — potential rootkit"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:kernel_module"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "persistence", "T1547.006"]
          enabled: true
