          from: now-360s
        - rule_id: cadre-l14-temp-exec
          name: "L14 — Process from Temp Directory"
          description: "Process execution from /tmp, /dev/shm, or /var/tmp — suspicious execution"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:proc_exec AND process.executable:(/tmp/* OR /dev/shm/* OR /var/tmp/*)"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "execution", "T1059"]
