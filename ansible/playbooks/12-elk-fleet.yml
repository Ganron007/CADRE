          from: now-360s
        - rule_id: cadre-l06-preload-hijack
          name: "L06 — ld.so.preload Write"
          description: "Write to /etc/ld.so.preload — shared object hijacking"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:preload_hijack"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "persistence", "T1574.006"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l07-container-escape
          name: "L07 — Container Escape"
          description: "Container escape syscall from podman child namespace"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:container_escape AND NOT auditd.log.AUID:-1"
          risk_score: 99
          severity: critical
          tags: ["CADRE", "linux", "privilege_escalation", "T1611"]
          enabled: true
          interval: 5m
          from: now-360s
        - rule_id: cadre-l08-cron-systemd
          name: "L08 — New Cron or Systemd Unit"
          description: "Cron job or systemd unit created — scheduled task persistence"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.key:(cron_dir OR cron_daily OR cron_hourly OR systemd_units)"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "persistence", "T1053.003", "T1543.002"]
