        cadre_linux_enroll_token: "{{ cadre_linux_token }}"



- name: "Play 3 — Enroll Elastic Agent on Windows VMs"
  hosts: windows_servers
  gather_facts: true
  vars:
    fleet_server: 192.168.77.50
    fleet_port: 8220
  tasks:
    - name: Check if Elastic Agent service exists
      ansible.windows.win_service:
        name: "Elastic Agent"
      register: agent_svc
      ignore_errors: true
      failed_when: false

    - name: Create Tools directory
      ansible.windows.win_file:
        path: C:\Tools
        state: directory
      when: agent_svc is defined and (agent_svc is failed or agent_svc.status is undefined)

    - name: Download Elastic Agent for Windows
      ansible.windows.win_get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-windows-x86_64.zip"
        dest: "C:\\Tools\\elastic-agent.zip"
      when: agent_svc is defined and (agent_svc is failed or agent_svc.status is undefined or agent_svc.status != "running")

    - name: Extract Elastic Agent
      community.windows.win_unzip:
        src: "C:\\Tools\\elastic-agent.zip"
        dest: "C:\\Tools\\"
        creates: "C:\\Tools\\elastic-agent-{{ elastic_agent_version }}-windows-x86_64"
      when: agent_svc is defined and (agent_svc is failed or agent_svc.status is undefined or agent_svc.status != "running")

    - name: Enroll and install Elastic Agent (Windows)
      ansible.windows.win_shell: |
        $svc = Get-Service "Elastic Agent" -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -eq "Running") { exit 0 }
        $env:PATH += ";C:\Tools\elastic-agent-{{ elastic_agent_version }}-windows-x86_64"
        & "C:\Tools\elastic-agent-{{ elastic_agent_version }}-windows-x86_64\elastic-agent.exe" install `
          --url="https://{{ fleet_server }}:{{ fleet_port }}" `
          --enrollment-token="{{ hostvars['elk']['cadre_all_enroll_token'] }}" `
          --insecure `
          --non-interactive `
          --force 2>&1
      register: win_install
      when: agent_svc is defined and (agent_svc is failed or agent_svc.status is undefined or agent_svc.status != "running")
      failed_when: false
      changed_when: false

    - name: Ensure Elastic Agent runs as auto + started
      ansible.windows.win_service:
        name: "Elastic Agent"
        state: started
        start_mode: auto

- name: "Play 4 — Enroll Elastic Agent on linux01"
  hosts: linux_members
  gather_facts: true
  vars:
    fleet_server: 192.168.77.50
    fleet_port: 8220
  tasks:
    - name: Check Elastic Agent config exists
      ansible.builtin.stat:
        path: /etc/elastic-agent/elastic-agent.yml
      register: agent_cfg

    - name: Download Elastic Agent for Linux
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ elastic_agent_version }}-linux-x86_64.tar.gz"
        dest: /tmp/elastic-agent.tar.gz
        mode: "0644"
      when: not agent_cfg.stat.exists

    - name: Extract Elastic Agent
      ansible.builtin.unarchive:
        src: /tmp/elastic-agent.tar.gz
        dest: /tmp/
        remote_src: true
        creates: /tmp/elastic-agent-{{ elastic_agent_version }}-linux-x86_64
      when: not agent_cfg.stat.exists

    - name: Enroll and install Elastic Agent (Linux)
      ansible.builtin.shell: |
        cd /tmp/elastic-agent-{{ elastic_agent_version }}-linux-x86_64
        ./elastic-agent install \
          --url=https://{{ fleet_server }}:{{ fleet_port }} \
          --enrollment-token={{ hostvars['elk']['cadre_linux_enroll_token'] }} \
          --insecure \
          --non-interactive \
          --force
      args:
        creates: /etc/elastic-agent/elastic-agent.yml
      when: not agent_cfg.stat.exists
      register: linux_install
      failed_when: false

    - name: Ensure elastic-agent service is running
      ansible.builtin.systemd:
        name: elastic-agent
        state: started
        enabled: true
        daemon_reload: true
