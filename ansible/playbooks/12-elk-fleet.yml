        - rule_id: cadre-l15-sudo-domain
          name: "L15 — Domain User sudo Execution"
          description: "Non-root sudo execution detected via auditd USER_CMD — potential privilege escalation"
          type: query
          language: kuery
          index: ["logs-auditd.log-*"]
          query: "auditd.log.record_type:USER_CMD AND NOT user.audit.id:0"
          risk_score: 73
          severity: high
          tags: ["CADRE", "linux", "privilege_escalation", "T1078.002"]
          enabled: true
          interval: 5m
          from: now-360s
      ignore_errors: true

    - name: Save enrollment tokens to shared fact
      ansible.builtin.set_fact:
