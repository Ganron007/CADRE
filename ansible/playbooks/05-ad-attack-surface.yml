        $ErrorActionPreference = "Stop"
        try {
          $user = Get-ADUser -Identity "intern_intel" -Server "dc03.range.local" -Properties DoesNotRequirePreAuth -ErrorAction SilentlyContinue
          if (-not $user) { Write-Output "SKIP: intern_intel not found"; exit 0 }
          if ($user.DoesNotRequirePreAuth -eq $true) { Write-Output "OK: intern_intel already no preauth"; exit 0 }
          Set-ADAccountControl -Identity "intern_intel" -Server "dc03.range.local" -DoesNotRequirePreAuth $true
          $v = Get-ADUser -Identity "intern_intel" -Server "dc03.range.local" -Properties DoesNotRequirePreAuth
          if ($v.DoesNotRequirePreAuth -ne $true) { throw "intern_intel not set" }
          Write-Output "APPLIED: intern_intel AS-REP enabled"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

- name: "Kerberoast SPN encryption + AS-REP for cadre.local (dc01)"
  hosts: dc01
  gather_facts: false
  tasks:
    # AES128+AES256 (24) — NOT RC4-only. RC4 is non-viable on Server 2025 (KDC blocks it),
    # so RC4-only accounts can't obtain tickets at all; these are DA/service accounts used
    # by DCSync/Golden Ticket/campaign chains, so they MUST be AES-capable. They remain
    # real AES Kerberoast targets (WT#002).
    - name: "[AUTH][WT#2] AES Kerberoast targets: chief_command, svc_ldap"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $applied = $false
          $targets = @("chief_command", "svc_ldap")
          foreach ($u in $targets) {
            $user = Get-ADUser -Identity $u -Properties msDS-SupportedEncryptionTypes
            if ($user.'msDS-SupportedEncryptionTypes' -eq 24) { Write-Output "OK: $u already AES128+AES256"; continue }
            Set-ADUser -Identity $u -Replace @{"msDS-SupportedEncryptionTypes"=24}
            $v = Get-ADUser -Identity $u -Properties msDS-SupportedEncryptionTypes
            if ($v.'msDS-SupportedEncryptionTypes' -ne 24) { throw "$u AES enc-types not applied" }
            Write-Output "APPLIED: $u set to AES128+AES256"; $applied = $true
          }
          if (-not $applied) { Write-Output "OK: All already AES128+AES256"; exit 0 }
          exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "[AUTH][WT#3] AS-REP: analyst_purple (cadre.local)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $user = Get-ADUser -Identity "analyst_purple" -Properties DoesNotRequirePreAuth -ErrorAction SilentlyContinue
          if (-not $user) { Write-Output "SKIP: analyst_purple not found"; exit 0 }
          if ($user.DoesNotRequirePreAuth -eq $true) { Write-Output "OK: analyst_purple already no preauth"; exit 0 }
          Set-ADAccountControl -Identity "analyst_purple" -DoesNotRequirePreAuth $true
          $v = Get-ADUser -Identity "analyst_purple" -Properties DoesNotRequirePreAuth
          if ($v.DoesNotRequirePreAuth -ne $true) { throw "analyst_purple not set" }
          Write-Output "APPLIED: analyst_purple AS-REP enabled"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

- name: "CVE-2026-25177 + SPN Unicode"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "SPN Unicode Jacking — Self ValidatedWriteSPN on analyst_cloud"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $self = [System.Security.Principal.SecurityIdentifier]"S-1-5-10"
          $vwSpnGUID = [GUID]"f3a64788-5306-11d1-a9c5-0000f80367c1"
          $desc = (Get-ADObject "CN=analyst_cloud,OU=Cloud,DC=cadre,DC=local" -Properties ntSecurityDescriptor).ntSecurityDescriptor
          $exists = $desc.Access | Where-Object { $_.ObjectType -eq $vwSpnGUID -and $_.IdentityReference -match "SELF" }
          if ($exists) { Write-Output "OK: Self ACE exists"; exit 0 }
          $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($self, [System.DirectoryServices.ActiveDirectoryRights]::Self, [System.Security.AccessControl.AccessControlType]::Allow, $vwSpnGUID)
          $desc.AddAccessRule($ace)
          Set-ADObject "CN=analyst_cloud,OU=Cloud,DC=cadre,DC=local" -Replace @{ntSecurityDescriptor=$desc}
          $vDesc = (Get-ADObject "CN=analyst_cloud,OU=Cloud,DC=cadre,DC=local" -Properties ntSecurityDescriptor).ntSecurityDescriptor
          $ver = $vDesc.Access | Where-Object { $_.ObjectType -eq $vwSpnGUID -and $_.IdentityReference -match "SELF" }
          if (-not $ver) { throw "Verify failed" }
          Write-Output "APPLIED: Self ValidatedWriteSPN on analyst_cloud"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "[PREP][WT#27] SPN uniqueness check disabled (SpnSuffixesValidationDisabled)"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name: SpnSuffixesValidationDisabled
        data: 1
        type: dword

# =============================================================================
# PART 4b: CVE-2026-25177 — Pre-stage Cyrillic homoglyph SPN (dc02)
# =============================================================================
- name: "CVE-2026-25177 — Pre-stage homoglyph SPN"
  hosts: dc02
  gather_facts: false
  tasks:
    - name: "[PREP][WT#27] Pre-stage Cyrillic homoglyph SPN on analyst_t1"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $obj = Get-ADUser -Identity "analyst_t1" -Properties ServicePrincipalNames -ErrorAction SilentlyContinue
          if (-not $obj) { $obj = Get-ADComputer -Identity "analyst_t1" -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
          if (-not $obj) { $obj = Get-ADServiceAccount -Identity "analyst_t1" -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
          if (-not $obj) { Write-Output "SKIP: analyst_t1 not found"; exit 0 }
          $homoglyphSPN = "MSSQLSvc/mbr01.child.c$([char]0x0430)dre.loc$([char]0x0430)l:1433"
          if ($obj.ServicePrincipalNames -contains $homoglyphSPN) { Write-Output "OK: Homoglyph SPN already present"; exit 0 }
          Set-ADUser -Identity "analyst_t1" -ServicePrincipalNames @{Add=$homoglyphSPN}
          $verify = Get-ADUser -Identity "analyst_t1" -Properties ServicePrincipalNames
          if ($verify.ServicePrincipalNames -notcontains $homoglyphSPN) { throw "Verify failed" }
          Write-Output "APPLIED: Cyrillic homoglyph SPN registered on analyst_t1"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

# =============================================================================
# PART 5: AES-only encryption on range.local (dc03)
# =============================================================================
- name: "dc03 — AES-only encryption on all accounts"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[AUTH][WT#2] AES-only (type 24): all range.local accounts"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $applied = $false
          $users = Get-ADUser -Filter * -SearchBase "DC=range,DC=local" -Properties msDS-SupportedEncryptionTypes
          foreach ($u in $users) {
            if ($u.'msDS-SupportedEncryptionTypes' -ne 24) {
              Set-ADUser -Identity $u.DistinguishedName -Replace @{"msDS-SupportedEncryptionTypes"=24}
              $applied = $true
            }
          }
          $svcAccts = Get-ADServiceAccount -Filter * -SearchBase "DC=range,DC=local" -ErrorAction SilentlyContinue
          foreach ($s in $svcAccts) {
            if ($s.'msDS-SupportedEncryptionTypes' -ne 24) {
              Set-ADServiceAccount -Identity $s.DistinguishedName -Replace @{"msDS-SupportedEncryptionTypes"=24}
              $applied = $true
            }
          }
          $vUsers = Get-ADUser -Filter * -SearchBase "DC=range,DC=local" -Properties msDS-SupportedEncryptionTypes
          $bad = $vUsers | Where-Object { $_."msDS-SupportedEncryptionTypes" -ne 24 }
          if ($bad) { throw "$($bad.Count) accounts still wrong" }
          if (-not $applied) { Write-Output "OK: All already AES-only"; exit 0 }
          Write-Output "APPLIED: All accounts set to AES-only and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

# =============================================================================
# PART 6: Delegation settings (dc02 + dc03)
# =============================================================================
- name: "dc02 — Unconstrained delegation + RBCD"
  hosts: dc02
  gather_facts: false
  tasks:
    - name: "[DELEG][WT#4] Unconstrained delegation on mbr01$"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $comp = Get-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -Properties TrustedForDelegation -ErrorAction Stop
          if ($comp.TrustedForDelegation) { Write-Output "OK: mbr01 already trusted for delegation"; exit 0 }
          Set-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -TrustedForDelegation $true
          $v = Get-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -Properties TrustedForDelegation
          if (-not $v.TrustedForDelegation) { throw "Verify failed" }
          Write-Output "APPLIED: mbr01 TrustedForDelegation set and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "RBCD — analyst_t1 WriteProperty on mbr01$ (msDS-AllowedToActOnBehalfOfOtherIdentity)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $comp = Get-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -ErrorAction Stop
          $src = Get-ADUser -Identity "analyst_t1" -Server "dc02.child.cadre.local"
          $sourceSID = $src.SID.Value
          $rbcdGUID = [GUID]"3f78c3e5-f79a-46bd-a0b8-9d18116ddc79"
          $desc = (Get-ADObject $comp.DistinguishedName -Properties ntSecurityDescriptor).ntSecurityDescriptor
          $exists = $desc.Access | Where-Object { try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq $sourceSID } catch { $false } }
          if ($exists) { Write-Output "OK: ACE exists"; exit 0 }
          $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule([System.Security.Principal.SecurityIdentifier]$sourceSID, [System.DirectoryServices.ActiveDirectoryRights]::WriteProperty, [System.Security.AccessControl.AccessControlType]::Allow, $rbcdGUID)
          $desc.AddAccessRule($ace)
          Set-ADObject $comp.DistinguishedName -Replace @{ntSecurityDescriptor=$desc}
          $vDesc = (Get-ADObject $comp.DistinguishedName -Properties ntSecurityDescriptor).ntSecurityDescriptor
          $ver = $vDesc.Access | Where-Object { try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq $sourceSID } catch { $false } }
          if (-not $ver) { throw "Verify failed" }
          Write-Output "APPLIED: RBCD analyst_t1 -> mbr01$ set and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

- name: "dc03 — Constrained delegation"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[DELEG][WT#5] Constrained delegation mbr02$ (prototrans)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $computer = Get-ADComputer -Identity "mbr02" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo, userAccountControl
          if (-not $computer) { Write-Output "SKIP: mbr02 not found"; exit 0 }
          $expectedSPNs = @("cifs/dc03.range.local", "ldap/dc03.range.local")
          $currentSPNs = @($computer."msDS-AllowedToDelegateTo")
          $hasSPNs = ($currentSPNs.Count -ge 2 -and $currentSPNs -contains $expectedSPNs[0] -and $currentSPNs -contains $expectedSPNs[1])
          $hasProtoTrans = ($computer.userAccountControl -band 0x0080000) -eq 0x0080000
          if ($hasSPNs -and $hasProtoTrans) { Write-Output "OK: Already configured"; exit 0 }
          if (-not $hasSPNs) { Set-ADComputer -Identity "mbr02" -Server "dc03.range.local" -Add @{ "msDS-AllowedToDelegateTo" = [string[]]@("cifs/dc03.range.local", "ldap/dc03.range.local") } }
          if (-not $hasProtoTrans) { Set-ADComputer -Identity "mbr02" -Server "dc03.range.local" -Replace @{"userAccountControl"=$computer.userAccountControl -bor 0x0080000} }
          $v = Get-ADComputer -Identity "mbr02" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo, userAccountControl
          $vSPNs = @($v."msDS-AllowedToDelegateTo")
          if (-not ($vSPNs -contains $expectedSPNs[0] -and $vSPNs -contains $expectedSPNs[1])) { throw "SPNs not set" }
          if (($v.userAccountControl -band 0x0080000) -ne 0x0080000) { throw "Prototrans flag not set" }
          Write-Output "APPLIED: mbr02 constrained delegation (prototrans) configured and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "[DELEG][WT#6] Constrained delegation svc_sccm (no prototrans)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          # NOTE 2026-08-01: S4U2Proxy REQUIRES BOTH msDS-AllowedToDelegateTo AND
          # TrustedToAuthForDelegation (UAC 0x80000) — the attribute alone fails with
          # KDC_ERR_BADOPTION on the S4U2Proxy step (verified live).
          $user = Get-ADUser -Identity "svc_sccm" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo, TrustedToAuthForDelegation
          if (-not $user) { Write-Output "SKIP: svc_sccm not found"; exit 0 }
          $expectedSPN = "HTTP/mbr02.range.local"
          $currentSPNs = @($user."msDS-AllowedToDelegateTo")
          if (($currentSPNs -contains $expectedSPN) -and $user.TrustedToAuthForDelegation) { Write-Output "OK: Already configured (ATD + TrustedToAuthForDelegation)"; exit 0 }
          Set-ADUser -Identity "svc_sccm" -Server "dc03.range.local" -Add @{ "msDS-AllowedToDelegateTo" = [string[]]@($expectedSPN) } -TrustedToAuthForDelegation $true
          $v = Get-ADUser -Identity "svc_sccm" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo, TrustedToAuthForDelegation
          $vSPNs = @($v."msDS-AllowedToDelegateTo")
          if (-not (($vSPNs -contains $expectedSPN) -and $v.TrustedToAuthForDelegation)) { throw "SPN/flag not applied" }
          Write-Output "APPLIED: svc_sccm constrained delegation (ATD + TrustedToAuthForDelegation) configured and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

# =============================================================================
# PART 4: Branch A additional surfaces — GPP + AdminSDHolder
# =============================================================================
- name: "dc01 — Branch A additional surfaces"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[BRANCH-A][GPP] Deploy SYSVOL Groups.xml with cpassword"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $domain = "cadre.local"
          $policyGuid = "{6A7B8C9D-1234-5678-90AB-CDEF01234567}"
          $path = "\\dc01.cadre.local\SYSVOL\$domain\Policies\$policyGuid\Machine\Preferences\Groups"
          New-Item -ItemType Directory -Path $path -Force | Out-Null
          # cpassword = AES-256-ECB(MS14-025 static key) of UTF-16LE "s3rv1c3_Ld@p!" -> svc_ldap (real account)
          $content = '<?xml version="1.0" encoding="utf-8"?>' + "`r`n" +
                     '<Groups clsid="{3125E937-EB16-4b4c-9934-544FC6D24D26}">' + "`r`n" +
                     '  <User clsid="{DF5F1855-50E4-4402-8C65-4F83F7B07AAC}" name="CADRE\svc_ldap" image="0" changed="2026-07-31T00:00:00">' + "`r`n" +
                     '    <Properties action="U" newName="" fullName="" description="" cpassword="SJdRfgL08RXe4gdPngTefd3BFXTwkOk/fWTi9K0TGeY=" />' + "`r`n" +
                     '  </User>' + "`r`n" +
                     '</Groups>'
          Set-Content -Path "$path\Groups.xml" -Value $content -Encoding UTF8
          if (-not (Test-Path "$path\Groups.xml")) { throw "Groups.xml missing" }
          Write-Output "APPLIED: SYSVOL Groups.xml deployed"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "[BRANCH-A][AdminSDHolder] Grant analyst_cloud WriteDacl on AdminSDHolder"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          Import-Module ActiveDirectory
          Set-Location AD:
          $TargetDN = "CN=AdminSDHolder,CN=System,DC=cadre,DC=local"
          $Principal = "CADRE\analyst_cloud"
          $Rights = [System.DirectoryServices.ActiveDirectoryRights]::WriteDacl
          $AccessControlType = [System.Security.AccessControl.AccessControlType]::Allow
          $InheritanceType = [System.DirectoryServices.ActiveDirectorySecurityInheritance]::None
          $Acl = Get-Acl -Path $TargetDN
          $Identity = New-Object System.Security.Principal.NTAccount($Principal)
          $IdentitySid = $Identity.Translate([System.Security.Principal.SecurityIdentifier]).Value
          $exists = $Acl.Access | Where-Object {
            $ref = $_.IdentityReference.Value
            try { $ref = $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch {}
            $ref -eq $IdentitySid -or $_.IdentityReference.Value -eq $IdentitySid
          }
          if ($exists) { Write-Output "OK: AdminSDHolder ACE exists"; exit 0 }
          $Rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $AccessControlType, [Guid]::Empty, $InheritanceType)
          $Acl.AddAccessRule($Rule)
          Set-Acl -Path $TargetDN -AclObject $Acl
          $vAcl = Get-Acl -Path $TargetDN
          $verified = $vAcl.Access | Where-Object {
            $ref = $_.IdentityReference.Value
            try { $ref = $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value } catch {}
            $ref -eq $IdentitySid -or $_.IdentityReference.Value -eq $IdentitySid
          }
          if (-not $verified) { throw "Verify failed" }
          Write-Output "APPLIED: analyst_cloud WriteDacl on AdminSDHolder"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]
