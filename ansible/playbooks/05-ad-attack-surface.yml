- name: "dc01 — ACE group 3 (DCSync)"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "ACE#13+14 — eng_agentic → DC=cadre: DCSync (Get-Changes + Get-Changes-All)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          Import-Module ActiveDirectory
          Set-Location AD:
          $TargetDN = "DC=cadre,DC=local"
          $Principal = "CADRE\eng_agentic"
          $Rights = [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight
          $AccessControlType = [System.Security.AccessControl.AccessControlType]::Allow
          $dcsyncGUID = [GUID]"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
          $dcsyncAllGUID = [GUID]"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2"
          $Acl = Get-Acl -Path $TargetDN
          $Identity = New-Object System.Security.Principal.NTAccount($Principal)
          $checkId = $Identity.Translate([System.Security.Principal.SecurityIdentifier]).Value
          $exists1 = $Acl.Access | Where-Object { $_.IdentityReference.Value -eq $checkId -and $_.ObjectType -eq $dcsyncGUID }
          $exists2 = $Acl.Access | Where-Object { $_.IdentityReference.Value -eq $checkId -and $_.ObjectType -eq $dcsyncAllGUID }
          if ($exists1 -and $exists2) { Write-Output "OK: Both DCSync ACEs exist"; exit 0 }
          if (-not $exists1) { $Rule1 = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $AccessControlType, $dcsyncGUID); $Acl.AddAccessRule($Rule1) }
          if (-not $exists2) { $Rule2 = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $AccessControlType, $dcsyncAllGUID); $Acl.AddAccessRule($Rule2) }
          Set-Acl -Path $TargetDN -AclObject $Acl
          $vAcl = Get-Acl -Path $TargetDN
          $v1 = $vAcl.Access | Where-Object { $_.IdentityReference.Value -eq $checkId -and $_.ObjectType -eq $dcsyncGUID }
          $v2 = $vAcl.Access | Where-Object { $_.IdentityReference.Value -eq $checkId -and $_.ObjectType -eq $dcsyncAllGUID }
          if (-not $v1 -or -not $v2) { throw "Verify failed" }
          Write-Output "APPLIED: DCSync ACEs granted to eng_agentic"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

