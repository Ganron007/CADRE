---
# TYPE: DEPLOY (rc=0=skip, rc=2=applied+verified, rc=1=fail)
# Layer 5: AD Attack Surface — Deploy ACEs, SPNs, AS-REP, delegation
# All tasks use win_shell rc=2 pattern.
# ACEs use Set-Acl pattern (Get-Acl/Set-Acl) for pre-check + verify.

# =============================================================================
# PART 1: ACEs — cadre.local (dc01, 14 ACEs across 13 entries)
# =============================================================================
- name: "dc01 — ACE group 1 (GPO delegations)"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "ACE#1 — analyst_cloud → Vulnerable-GPO: GpoEditDeleteModifySecurity"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $gpoName = "Vulnerable-GPO"; $targetUser = "analyst_cloud"
          $gpo = Get-GPO -Name $gpoName -ErrorAction SilentlyContinue
          if (-not $gpo) { Write-Output "SKIP: GPO '$gpoName' not found"; exit 0 }
          $existing = Get-GPPermission -Name $gpoName -TargetName $targetUser -TargetType User -ErrorAction SilentlyContinue
          if ($existing -and $existing.Permission -eq "GpoEditDeleteModifySecurity") { Write-Output "OK: Already set"; exit 0 }
          Set-GPPermissions -Name $gpoName -TargetName $targetUser -TargetType User -PermissionLevel GpoEditDeleteModifySecurity
          $verify = Get-GPPermission -Name $gpoName -TargetName $targetUser -TargetType User
          if (-not $verify -or $verify.Permission -ne "GpoEditDeleteModifySecurity") { throw "Verify failed" }
          Write-Output "APPLIED: $targetUser granted GpoEditDeleteModifySecurity on $gpoName"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

    - name: "ACE#2 — eng_agentic → WMI-Filtered-GPO: GpoEditDeleteModifySecurity"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $gpoName = "WMI-Filtered-GPO"; $targetUser = "eng_agentic"
          $gpo = Get-GPO -Name $gpoName -ErrorAction SilentlyContinue
          if (-not $gpo) { Write-Output "SKIP: GPO '$gpoName' not found"; exit 0 }
          $existing = Get-GPPermission -Name $gpoName -TargetName $targetUser -TargetType User -ErrorAction SilentlyContinue
          if ($existing -and $existing.Permission -eq "GpoEditDeleteModifySecurity") { Write-Output "OK: Already set"; exit 0 }
          Set-GPPermissions -Name $gpoName -TargetName $targetUser -TargetType User -PermissionLevel GpoEditDeleteModifySecurity
          $verify = Get-GPPermission -Name $gpoName -TargetName $targetUser -TargetType User
          if (-not $verify -or $verify.Permission -ne "GpoEditDeleteModifySecurity") { throw "Verify failed" }
          Write-Output "APPLIED: $targetUser granted GpoEditDeleteModifySecurity on $gpoName"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

