# =============================================================================
# PART 4: Kerberos Attack Surface (dc01 target)
# =============================================================================
- name: "SPN Registration — cadre.local (via dc01)"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[SPN][WT#1][WT#33] Register SPNs: svc_ldap, chief_command, mssql-linux01"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $entries = @(
            @{User="svc_ldap"; SPN="ldap/svc-ldap.cadre.local"},
            @{User="chief_command"; SPN="HTTP/cadre-portal.cadre.local"},
            @{User="mssql-linux01"; SPN="MSSQLSvc/linux01.cadre.local:1433"}
          )
          $applied = $false
          foreach ($e in $entries) {
            $obj = Get-ADUser -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue
            if (-not $obj) { $obj = Get-ADComputer -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
            if (-not $obj) { $obj = Get-ADServiceAccount -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
            if (-not $obj) { continue }
            if ($obj.ServicePrincipalNames -contains $e.SPN) { continue }
            if ($obj.ObjectClass -eq "computer") {
              Set-ADComputer -Identity $e.User -ServicePrincipalNames @{Add=$e.SPN}
            } elseif ($obj.ObjectClass -eq "msDS-GroupManagedServiceAccount") {
              Set-ADServiceAccount -Identity $e.User -ServicePrincipalNames @{Add=$e.SPN}
            } else {
              Set-ADUser -Identity $e.User -ServicePrincipalNames @{Add=$e.SPN}
            }
            $applied = $true
          }
          if (-not $applied) { Write-Output "OK: All SPNs already present"; exit 0 }
          Write-Output "APPLIED: cadre.local SPNs registered"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc not in [0, 2]

