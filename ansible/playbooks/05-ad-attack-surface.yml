        $ErrorActionPreference = "Stop"
        try {
          Import-Module ActiveDirectory
          Set-Location AD:
          $TargetDN = "CN=Red-Cadre,OU=RedCell,DC=cadre,DC=local"
          $Principal = "CADRE\Engineering-Cadre"
          $Rights = [System.DirectoryServices.ActiveDirectoryRights]::WriteDacl
          $AccessControlType = [System.Security.AccessControl.AccessControlType]::Allow
          $ObjectType = $null
          $Acl = Get-Acl -Path $TargetDN
          $Identity = New-Object System.Security.Principal.NTAccount($Principal)
          $exists = $Acl.Access | Where-Object { $_.IdentityReference.Value -eq $Identity.Translate([System.Security.Principal.SecurityIdentifier]).Value }
          if ($exists) { Write-Output "OK: ACE exists"; exit 0 }
          if (-not $ObjectType) {
            $Rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $AccessControlType)
          } else {
            $Rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($Identity, $Rights, $AccessControlType, $ObjectType)
          }
          $Acl.AddAccessRule($Rule)
          Set-Acl -Path $TargetDN -AclObject $Acl
          $vAcl = Get-Acl -Path $TargetDN
          $verified = $vAcl.Access | Where-Object { $_.IdentityReference.Value -eq $Identity.Translate([System.Security.Principal.SecurityIdentifier]).Value }
          if (-not $verified) { throw "Verify failed" }
          Write-Output "APPLIED: Engineering-Cadre WriteDacl on Red-Cadre"; exit 2
