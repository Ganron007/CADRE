- name: "Verify forest trust — cadre.local side"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[VERIFY][WT#33] Forest trust to range.local exists"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $trust = Get-ADTrust -Filter "Name -eq 'range.local'" -ErrorAction SilentlyContinue
          if ($trust) { Write-Output "PASS: Forest trust cadre.local→range.local exists"; exit 0 }
          Write-Output "FAIL: Forest trust cadre.local→range.local not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "Verify forest trust — range.local side"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[VERIFY][WT#33] Forest trust to cadre.local exists"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
