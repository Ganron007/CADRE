- name: "Create forest trust — cadre.local side"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[PREP][WT#33] Establish bidirectional trust to range.local"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          Import-Module ActiveDirectory
          $localForest = Get-ADForest -Current LocalComputer
          $existing = $localForest.Trusts | Where-Object { $_.Target -eq "range.local" }
          if ($existing) { Write-Output "OK: Trust to range.local already exists"; exit 0 }
          $context = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext('Forest', $localForest.Name)
          $forestObj = [System.DirectoryServices.ActiveDirectory.Forest]::GetForest($context)
          $forestObj.CreateLocalSideOfTrustRelationship("range.local", 'Bidirectional', "S@fe_CADRE_Trust_2026!")
          $v = Get-ADTrust -Filter "Name -eq 'range.local'" -ErrorAction Stop
          if (-not $v) { throw "Trust not found after creation" }
          Write-Output "APPLIED: Forest trust cadre.local→range.local created and verified"; exit 2
        } catch { Write-Output "FAILED: $_"; exit 1 }
      register: r
      changed_when: r.rc == 2
      failed_when: r.rc == 1

- name: "Create forest trust — range.local side"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[PREP][WT#33] Establish bidirectional trust to cadre.local"
