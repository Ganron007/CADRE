# =============================================================================
# PART 4: Kerberos Attack Surface — SPN + AS-REP + RC4 (dc01, dc02, dc03)
# =============================================================================
- name: "SPN Registration — cadre.local (via dc01)"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "[SPN][WT#1][WT#33] Verify SPNs: svc_ldap, chief_command, mssql-linux01"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $entries = @(
            @{User="svc_ldap"; SPN="ldap/svc-ldap.cadre.local"},
            @{User="chief_command"; SPN="HTTP/cadre-portal.cadre.local"},
            @{User="mssql-linux01"; SPN="MSSQLSvc/linux01.cadre.local:1433"}
          )
          $missing = @()
          foreach ($e in $entries) {
            $obj = Get-ADUser -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue
            if (-not $obj) { $obj = Get-ADComputer -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
            if (-not $obj) { $obj = Get-ADServiceAccount -Identity $e.User -Properties ServicePrincipalNames -ErrorAction SilentlyContinue }
            if (-not $obj) { $missing += "$($e.User): not found"; continue }
