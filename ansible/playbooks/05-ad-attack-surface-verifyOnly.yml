- name: "dc01 — ACE group 1 (GPO delegations)"
  hosts: dc01
  gather_facts: false
  tasks:
    - name: "ACE#1 — analyst_cloud → Vulnerable-GPO: GpoEditDeleteModifySecurity (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $existing = Get-GPPermission -Name "Vulnerable-GPO" -TargetName "analyst_cloud" -TargetType User -ErrorAction SilentlyContinue
          if ($existing -and $existing.Permission -eq "GpoEditDeleteModifySecurity") {
            Write-Output "PASS: GPO delegation exists"; exit 0
          }
          Write-Output "FAIL: GPO delegation not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

