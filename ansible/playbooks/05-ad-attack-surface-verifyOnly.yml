# =============================================================================
# PART 5: AES-only encryption on range.local (dc03)
# =============================================================================
- name: "dc03 — AES-only encryption on all accounts"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[AUTH][WT#2] AES-only (type 24): all range.local accounts (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $bad = @()
          $users = Get-ADUser -Filter * -SearchBase "DC=range,DC=local" -Properties msDS-SupportedEncryptionTypes
          foreach ($u in $users) {
            if ($u.'msDS-SupportedEncryptionTypes' -ne 24) { $bad += "$($u.SamAccountName)=$($u.'msDS-SupportedEncryptionTypes')" }
          }
          $svcAccts = Get-ADServiceAccount -Filter * -SearchBase "DC=range,DC=local" -Properties msDS-SupportedEncryptionTypes -ErrorAction SilentlyContinue
          foreach ($s in $svcAccts) {
            if ($s.'msDS-SupportedEncryptionTypes' -ne 24) { $bad += "$($s.SamAccountName)=$($s.'msDS-SupportedEncryptionTypes')" }
          }
          if ($bad.Count -eq 0) { Write-Output "PASS: All accounts AES-only (type 24)"; exit 0 }
          Write-Output "FAIL: $($bad.Count) accounts not AES-only: $($bad -join '; ')"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

