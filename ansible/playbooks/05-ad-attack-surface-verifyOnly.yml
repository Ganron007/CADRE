# PART 6: Delegation settings (dc02 + dc03)
# =============================================================================
- name: "dc02 — Unconstrained delegation + RBCD"
  hosts: dc02
  gather_facts: false
  tasks:
    - name: "[DELEG][WT#4] Unconstrained delegation on mbr01$ (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $comp = Get-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -Properties TrustedForDelegation -ErrorAction SilentlyContinue
          if (-not $comp) { Write-Output "SKIP: mbr01 not found"; exit 0 }
          if ($comp.TrustedForDelegation) {
            Write-Output "PASS: mbr01 trusted for delegation"; exit 0
          }
          Write-Output "FAIL: mbr01 not trusted for delegation"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "RBCD — analyst_t1 WriteProperty on mbr01$ (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $comp = Get-ADComputer -Identity "mbr01" -Server "dc02.child.cadre.local" -ErrorAction SilentlyContinue
          if (-not $comp) { Write-Output "SKIP: mbr01 not found"; exit 0 }
          $sourceSID = (Get-ADUser -Identity "analyst_t1" -Server "dc02.child.cadre.local").SID.Value
          $rbcdGUID = [GUID]"3f78c3e5-f79a-46bd-a0b8-9d18116ddc79"
          $desc = (Get-ADObject $comp.DistinguishedName -Properties ntSecurityDescriptor).ntSecurityDescriptor
          $exists = $desc.Access | Where-Object { try { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value -eq $sourceSID -and $_.ObjectType -eq $rbcdGUID } catch { $false } }
          if ($exists) { Write-Output "PASS: RBCD ACE exists"; exit 0 }
          Write-Output "FAIL: RBCD ACE not found"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

- name: "dc03 — Constrained delegation"
  hosts: dc03
  gather_facts: false
  tasks:
    - name: "[DELEG][WT#5] Constrained delegation mbr02$ (prototrans) (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $computer = Get-ADComputer -Identity "mbr02" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo, userAccountControl -ErrorAction SilentlyContinue
          if (-not $computer) { Write-Output "SKIP: mbr02 not found"; exit 0 }
          $expectedSPNs = @("cifs/dc03.range.local", "ldap/dc03.range.local")
          $currentSPNs = @($computer."msDS-AllowedToDelegateTo")
          $hasSPNs = ($currentSPNs.Count -ge 2 -and $currentSPNs -contains $expectedSPNs[0] -and $currentSPNs -contains $expectedSPNs[1])
          $hasProtoTrans = ($computer.userAccountControl -band 0x0080000) -eq 0x0080000
          if ($hasSPNs -and $hasProtoTrans) {
            Write-Output "PASS: mbr02 constrained delegation configured"; exit 0
          }
          $failures = @()
          if (-not $hasSPNs) { $failures += "missing SPNs" }
          if (-not $hasProtoTrans) { $failures += "missing prototrans flag" }
          Write-Output "FAIL: $($failures -join ', ')"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1

    - name: "[DELEG][WT#6] Constrained delegation svc_sccm (no prototrans) (VERIFY)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"
        try {
          $user = Get-ADUser -Identity "svc_sccm" -Server "dc03.range.local" -Properties msDS-AllowedToDelegateTo -ErrorAction SilentlyContinue
          if (-not $user) { Write-Output "SKIP: svc_sccm not found"; exit 0 }
          $expectedSPN = "HTTP/mbr02.range.local"
          $currentSPNs = @($user."msDS-AllowedToDelegateTo")
          if ($currentSPNs -contains $expectedSPN) {
            Write-Output "PASS: svc_sccm constrained delegation configured"; exit 0
          }
          Write-Output "FAIL: svc_sccm missing delegation SPN"; exit 1
        } catch { Write-Output "FAIL: $_"; exit 1 }
      register: r
      changed_when: false
      failed_when: r.rc == 1
