    - name: Verify seed detection rules exist
      ansible.builtin.shell: |
        failed=0
        for rid in cadre-002-asrep-roast cadre-003-dcsync cadre-004-suspicious-proc cadre-005-adcs-tamper cadre-006-ntlm-relay cadre-007-zeek-kerberoast cadre-008-gmsa-extract cadre-l01-keytab-read cadre-l02-realm-change cadre-l03-sssd-cache cadre-l04-suid-binary cadre-l05-kernel-module cadre-l06-preload-hijack cadre-l07-container-escape cadre-l08-cron-systemd cadre-l09-mssql-brute cadre-l11-nfs-krb5 cadre-l12-authorized-keys cadre-l13-pam-change cadre-l14-temp-exec cadre-l15-sudo-domain; do
          code=$(curl -s -o /dev/null -w "%{http_code}" -u "elastic:{{ elastic_password }}" "http://127.0.0.1:{{ kibana_port }}/api/detection_engine/rules?rule_id=$rid" -H "kbn-xsrf: true")
          [ "$code" = "200" ] || { echo "FAIL: rule $rid not found (HTTP $code)"; failed=1; }
        done
        [ "$failed" -eq 0 ] && echo "PASS: all 21 detection rules exist" || echo "FAIL: some detection rules missing"
      changed_when: false
      failed_when: false
      register: rules_check

    - name: Verify seed detection rule query content (9 fixed rules)
      ansible.builtin.shell: |
        failed=0
        AUTH="-u elastic:{{ elastic_password }}"
        KBN="-H kbn-xsrf: true"
        BASE="http://127.0.0.1:{{ kibana_port }}/api/detection_engine/rules?rule_id"

        check_query() {
          local rid="$1" expected="$2"
          local query
          query=$(curl -s $AUTH "$BASE=$rid" $KBN | jq -r '.query')
          echo "$query" | grep -qF "$expected" && echo "PASS: $rid query contains '$expected'" || { echo "FAIL: $rid query missing '$expected'"; failed=1; }
        }

        check_query "cadre-003-dcsync"    "*0x100*"
        check_query "cadre-004-suspicious-proc" "process.command_line"
        check_query "cadre-005-adcs-tamper" "process.command_line"
        check_query "cadre-007-zeek-kerberoast" "KDC_ERR_ETYPE_NOSUPP"
        check_query "cadre-008-gmsa-extract" "e48d0154"
        check_query "cadre-l04-suid-binary" "/tmp/suid_bash"
        check_query "cadre-l12-authorized-keys" "auditd.log.name"
        check_query "cadre-l09-mssql-brute" "Login failed"
        check_query "cadre-l15-sudo-domain" "auditd.log.record_type:USER_CMD"

        [ "$failed" -eq 0 ] && echo "PASS: all rule queries verified" || echo "FAIL: some rule queries incorrect"
        exit $failed
      changed_when: false
      failed_when: false
      register: rule_query_check

    - name: Verify 006 threshold rule fields (NTLM + source.ip)
      ansible.builtin.shell: |
        AUTH="-u elastic:{{ elastic_password }}"
        KBN="-H kbn-xsrf: true"
        BASE="http://127.0.0.1:{{ kibana_port }}/api/detection_engine/rules?rule_id=cadre-006-ntlm-relay"
        rule=$(curl -s $AUTH "$BASE" $KBN)
        query=$(echo "$rule" | jq -r '.query')
        threshold=$(echo "$rule" | jq -r '.threshold.field[0]')
        echo "$query" | grep -q "AuthenticationPackageName:NTLM" || { echo "FAIL: 006 query missing NTLM filter"; exit 1; }
        [ "$threshold" = "source.ip" ] || { echo "FAIL: 006 threshold field is '$threshold', expected 'source.ip'"; exit 1; }
        echo "PASS: 006 NTLM query + source.ip threshold verified"
      changed_when: false
      failed_when: false
      register: rule_006_check

    - name: Save enrollment tokens to shared fact
      ansible.builtin.set_fact:
        cadre_all_enroll_token: "{{ cadre_all_token }}"
        cadre_linux_enroll_token: "{{ cadre_linux_token }}"



# ws01 is on CADRE-All with other Windows VMs (no CADRE-WS01 policy). Detailed checks also in 17-ws01-deploy-verifyOnly.yml.
- name: "Play 3 — Verify Elastic Agent enrollment on Windows VMs (CADRE-All; includes ws01)"
  hosts: windows_servers
  gather_facts: true
  vars:
    fleet_server: 192.168.77.50
    fleet_port: 8220
  tasks:
    - name: Check if Elastic Agent service exists
      ansible.windows.win_service:
        name: "Elastic Agent"
      register: agent_svc
      ignore_errors: true
      failed_when: false

    - name: Verify Tools directory exists
      ansible.windows.win_stat:
        path: C:\Tools
      register: tools_dir_check

    - name: Verify Elastic Agent zip downloaded
      ansible.windows.win_stat:
        path: C:\Tools\elastic-agent.zip
      register: agent_zip_check

    - name: Verify Elastic Agent extracted
      ansible.windows.win_stat:
        path: "C:\\Tools\\elastic-agent-{{ elastic_agent_version }}-windows-x86_64"
      register: agent_extract_check

    - name: Verify Elastic Agent is enrolled and running (Windows)
      ansible.windows.win_shell: |
        $svc = Get-Service "Elastic Agent" -ErrorAction SilentlyContinue
        if ($svc -and $svc.Status -eq "Running") { Write-Output "PASS: Elastic Agent service is running"; exit 0 }
        else { Write-Output "FAIL: Elastic Agent service is not running"; exit 1 }
      register: win_agent_check
      changed_when: false
      failed_when: false

    - name: Verify Elastic Agent service start mode
      ansible.windows.win_service:
        name: "Elastic Agent"
      register: agent_svc_check
      failed_when: agent_svc_check.start_mode != "auto" or agent_svc_check.state != "running"

- name: "Play 4 — Verify Elastic Agent enrollment on linux01"
  hosts: linux_members
  gather_facts: true
  vars:
    fleet_server: 192.168.77.50
    fleet_port: 8220
  tasks:
    - name: Check Elastic Agent config exists
      ansible.builtin.stat:
        path: /etc/elastic-agent/elastic-agent.yml
      register: agent_cfg

    - name: Verify Elastic Agent tarball downloaded
      ansible.builtin.shell: |
        test -f /tmp/elastic-agent.tar.gz && echo "PASS: tarball exists" || echo "FAIL: tarball missing"
      changed_when: false
      failed_when: false
      register: linux_tarball_check

    - name: Verify Elastic Agent extracted
      ansible.builtin.shell: |
        test -d /tmp/elastic-agent-{{ elastic_agent_version }}-linux-x86_64 && echo "PASS: extracted directory exists" || echo "FAIL: extracted directory missing"
      changed_when: false
      failed_when: false
      register: linux_extract_check

    - name: Verify Elastic Agent is enrolled and running (Linux)
      ansible.builtin.shell: |
        systemctl is-active elastic-agent 2>/dev/null | grep -q "^active" && echo "PASS: elastic-agent is active and enrolled" || echo "FAIL: elastic-agent is not running"
      changed_when: false
      failed_when: false
      register: linux_agent_check

    - name: Verify elastic-agent service is enabled and active
      ansible.builtin.shell: |
        systemctl is-enabled elastic-agent 2>/dev/null | grep -q "^enabled" && echo "PASS: elastic-agent is enabled" || echo "FAIL: elastic-agent is not enabled"
        systemctl is-active elastic-agent 2>/dev/null | grep -q "^active" && echo "PASS: elastic-agent is active" || echo "FAIL: elastic-agent is not active"
      changed_when: false
      failed_when: false
      register: linux_svc_check
