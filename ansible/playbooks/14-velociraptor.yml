---
# TYPE: DEPLOY (rc=0=skip, rc=2=applied+verified, rc=1=fail)
# ============================================================
# velociraptor extension — Server + Client enrollment + Hunts
# + MCP endpoint for Plan 7 agentic pipeline
# ============================================================

- name: "Play 1 — Install Velociraptor server on vr VM"
  hosts: vr
  gather_facts: true
  become: yes
  vars:
    vr_release_tag: "0.76"
    vr_binary_version: "0.76.1"
    vr_host: "192.168.77.51"
    vr_gui_port: 8889
    vr_api_port: 8001
    vr_frontend_port: 8000
    vr_admin_password: "VelociraptorDefault!"
    vr_mcp_port: 8002
    # Lab MCP bearer for DFIR-Nexus RemoteVRMCPClient (NEXUS_VR_MCP_URL + NEXUS_VR_MCP_API_KEY).
    # Do not point NEXUS_VR_ENDPOINT at :8001 — that port is gRPC, not HTTP Query.
    vr_mcp_api_key: "CadreVrMcp!Lab2026"
  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3
          - python3-pip
          - python3-yaml
          - wget
        state: present
        update_cache: true

    - name: Create Velociraptor directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/velociraptor
        - /var/lib/velociraptor
        - /var/lib/velociraptor/files
        - /var/log/velociraptor

    - name: Download Velociraptor binary
      ansible.builtin.get_url:
        url: "https://github.com/Velocidex/velociraptor/releases/download/v{{ vr_release_tag }}/velociraptor-v{{ vr_binary_version }}-linux-amd64"
        dest: /usr/local/bin/velociraptor
        mode: "0755"

    - name: Generate Velociraptor server config
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor config generate 2>/dev/null > /tmp/vr-full-config.yaml
        python3 << 'PYEOF'
        import yaml
        with open("/tmp/vr-full-config.yaml") as f:
            cfg = yaml.safe_load(f)
        cfg["Frontend"]["hostname"] = "{{ vr_host }}"
        cfg["Frontend"]["bind_address"] = "0.0.0.0"
        cfg["GUI"]["bind_address"] = "0.0.0.0"
        cfg["GUI"]["public_url"] = "https://{{ vr_host }}:{{ vr_gui_port }}/app/index.html"
        cfg["API"]["bind_address"] = "0.0.0.0"
        cfg["API"]["bind_port"] = {{ vr_api_port }}
        cfg["Client"]["server_urls"] = ["https://{{ vr_host }}:{{ vr_frontend_port }}/"]
        with open("/etc/velociraptor/server.config.yaml", "w") as f:
            yaml.dump(cfg, f, default_flow_style=False)
        PYEOF
        chmod 600 /etc/velociraptor/server.config.yaml
      args:
        creates: /etc/velociraptor/server.config.yaml

    - name: Add admin user to Velociraptor
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          user add --role administrator admin "{{ vr_admin_password }}"
      register: vr_user
      failed_when: false
      changed_when: "'already exists' not in vr_user.stdout"

    - name: Create Velociraptor systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/velociraptor.service
        content: |
          [Unit]
          Description=Velociraptor Server — Digital Forensics and Incident Response
          After=network.target
          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml frontend
          Restart=always
          LimitNOFILE=65536
          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Start Velociraptor server
      ansible.builtin.systemd:
        name: velociraptor
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for Velociraptor GUI
      ansible.builtin.wait_for:
        port: "{{ vr_gui_port }}"
        delay: 10
        timeout: 60

    - name: Generate Velociraptor client config
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          config client > /etc/velociraptor/client.config.yaml
      args:
        creates: /etc/velociraptor/client.config.yaml

    - name: Make client config world-readable (Ansible fetch runs as vagrant)
      ansible.builtin.file:
        path: /etc/velociraptor/client.config.yaml
        mode: "0644"

    - name: Download Windows Velociraptor MSI
      ansible.builtin.get_url:
        url: "https://github.com/Velocidex/velociraptor/releases/download/v{{ vr_release_tag }}/velociraptor-v{{ vr_binary_version }}-windows-amd64.msi"
        dest: /tmp/velociraptor.msi
        mode: "0644"

    - name: Repack MSI with client config
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          config repack --msi /tmp/velociraptor.msi \
          /etc/velociraptor/client.config.yaml \
          /var/lib/velociraptor/files/velociraptor-client-cadre.msi
      args:
        creates: /var/lib/velociraptor/files/velociraptor-client-cadre.msi

    - name: Make MSI world-readable (Ansible fetch runs as vagrant)
      ansible.builtin.file:
        path: /var/lib/velociraptor/files/velociraptor-client-cadre.msi
        mode: "0644"

    - name: Copy custom artifacts to vr VM
      ansible.builtin.copy:
        src: ../files/vr-artifacts/
        dest: /opt/cadre-artifacts/
        mode: "0644"

    - name: Mark custom artifacts copied (loaded via artifact_definitions_directories)
      ansible.builtin.file:
        path: /var/lib/velociraptor/.artifacts_imported
        state: touch
        mode: "0644"

    - name: Copy pre-built hunt artifacts to vr VM
      ansible.builtin.copy:
        src: ../files/vr-hunts/
        dest: /opt/cadre-hunts/
        mode: "0644"

    - name: Mark hunts copied (loaded via artifact_definitions_directories)
      ansible.builtin.file:
        path: /var/lib/velociraptor/.hunts_imported
        state: touch
        mode: "0644"

    - name: Create MCP install directory
      ansible.builtin.file:
        path: /opt/cadre-vr-mcp
        state: directory
        mode: "0755"

    - name: Point server catalog at CADRE hunts and artifacts (0.76 has no artifact add)
      ansible.builtin.copy:
        src: ../files/vr-mcp/patch_catalog.py
        dest: /opt/cadre-vr-mcp/patch_catalog.py
        mode: "0755"

    - name: Apply artifact_definitions_directories to server config
      ansible.builtin.shell: |
        python3 /opt/cadre-vr-mcp/patch_catalog.py /etc/velociraptor/server.config.yaml
        chmod 600 /etc/velociraptor/server.config.yaml
      register: vr_extra_defs
      changed_when: "'CHANGED' in vr_extra_defs.stdout"

    - name: Generate gRPC api_client YAML for MCP (administrator)
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          config api_client --name cadre-mcp --role administrator \
          /etc/velociraptor/api_client.yaml
        chmod 600 /etc/velociraptor/api_client.yaml
      args:
        creates: /etc/velociraptor/api_client.yaml
      register: vr_api_client

    - name: Ensure cadre-mcp API user exists in the datastore
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          user add --role administrator cadre-mcp "{{ vr_mcp_api_key }}"
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml \
          acl grant cadre-mcp --role administrator
      register: vr_mcp_user
      failed_when: false
      changed_when: false

    - name: Restart Velociraptor to load catalog dirs and API user
      ansible.builtin.systemd:
        name: velociraptor
        state: restarted
      when: vr_extra_defs.changed or vr_api_client.changed

    - name: Wait for Velociraptor GUI after restart
      ansible.builtin.wait_for:
        port: "{{ vr_gui_port }}"
        delay: 8
        timeout: 60
      when: vr_extra_defs.changed or vr_api_client.changed

    - name: Install Velociraptor MCP HTTP front
      ansible.builtin.copy:
        src: ../files/vr-mcp/mcp_server.py
        dest: /opt/cadre-vr-mcp/mcp_server.py
        mode: "0755"

    - name: Write MCP environment (API key + api_client path)
      ansible.builtin.copy:
        dest: /etc/velociraptor/mcp.env
        mode: "0600"
        content: |
          VR_MCP_BIND=0.0.0.0
          VR_MCP_PORT={{ vr_mcp_port }}
          VR_MCP_API_KEY={{ vr_mcp_api_key }}
          VR_API_CONFIG=/etc/velociraptor/api_client.yaml
          VR_BIN=/usr/local/bin/velociraptor

    - name: Create Velociraptor MCP systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/velociraptor-mcp.service
        mode: "0644"
        content: |
          [Unit]
          Description=Velociraptor MCP HTTP front (Nexus RemoteVRMCPClient)
          After=network.target velociraptor.service
          Wants=velociraptor.service
          [Service]
          Type=simple
          User=root
          EnvironmentFile=/etc/velociraptor/mcp.env
          ExecStart=/usr/bin/python3 /opt/cadre-vr-mcp/mcp_server.py
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target

    - name: Start Velociraptor MCP
      ansible.builtin.systemd:
        name: velociraptor-mcp
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for MCP port
      ansible.builtin.wait_for:
        port: "{{ vr_mcp_port }}"
        delay: 2
        timeout: 30

    - name: Open firewall ports
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ vr_frontend_port }}"
        - "{{ vr_gui_port }}"
        - "{{ vr_api_port }}"
        - "{{ vr_mcp_port }}"

    - name: Enroll vr server as its own client
      ansible.builtin.shell: |
        /usr/local/bin/velociraptor --config /etc/velociraptor/server.config.yaml config client > /etc/velociraptor/client.config.yaml
        chmod 600 /etc/velociraptor/client.config.yaml
      args:
        creates: /etc/velociraptor/client.config.yaml

    - name: Create vr client systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/velociraptor-client.service
        content: |
          [Unit]
          Description=Velociraptor Client
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/velociraptor --config /etc/velociraptor/client.config.yaml client
          Restart=always
          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Start vr client
      ansible.builtin.systemd:
        name: velociraptor-client
        state: started
        enabled: true
        daemon_reload: true
      ignore_errors: true

- name: "Play 2 — Enroll Velociraptor client on Windows VMs"
  hosts: windows_servers
  gather_facts: true
  tasks:
    - name: Remove stale Velociraptor MSI product registration if any
      ansible.windows.win_shell: |
        $guid = (Get-WmiObject Win32_Product | Where-Object { $_.Name -like "*Velociraptor*" }).IdentifyingNumber
        if ($guid) { msiexec /x $guid /quiet }
      register: vr_stale
      changed_when: false
      failed_when: false

    - name: Remove stale Velociraptor service if any
      ansible.windows.win_shell: |
        sc.exe delete Velociraptor 2>$null
        sc.exe delete 'Velociraptor Service' 2>$null
      changed_when: false
      failed_when: false

    - name: Create Tools directory
      ansible.windows.win_file:
        path: C:\Tools
        state: directory

    - name: Pull repacked MSI from vr server to controller
      ansible.builtin.fetch:
        src: /var/lib/velociraptor/files/velociraptor-client-cadre.msi
        dest: /tmp/vr-client-cadre.msi
        flat: true
      delegate_to: vr

    - name: Push repacked MSI to Windows VM
      ansible.windows.win_copy:
        src: /tmp/vr-client-cadre.msi
        dest: "C:\\Tools\\velociraptor-client.msi"

    - name: Install Velociraptor client on Windows
      ansible.windows.win_package:
        path: C:\Tools\velociraptor-client.msi
        arguments: /qn /norestart
        state: present
        expected_return_code: [0, 1641, 3010]
      register: vr_install

    - name: Ensure Velociraptor service is running
      ansible.windows.win_service:
        name: Velociraptor
        state: started
        start_mode: auto

- name: "Play 3 — Enroll Velociraptor client on linux01"
  hosts: linux_members
  gather_facts: true
  become: yes
  vars:
    vr_host: 192.168.77.51
    vr_frontend_port: 8000
    vr_release_tag: "0.76"
    vr_binary_version: "0.76.1"
  tasks:
    - name: Check if Velociraptor client binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/velociraptor-client
      register: vr_bin

    - name: Download Velociraptor Linux client binary
      ansible.builtin.get_url:
        url: "https://github.com/Velocidex/velociraptor/releases/download/v{{ vr_release_tag }}/velociraptor-v{{ vr_binary_version }}-linux-amd64"
        dest: /usr/local/bin/velociraptor-client
        mode: "0755"
      when: not vr_bin.stat.exists

    - name: Fetch client config from vr server
      ansible.builtin.fetch:
        src: /etc/velociraptor/client.config.yaml
        dest: /tmp/vr-client-config.yaml
        flat: true
      delegate_to: vr

    - name: Create Velociraptor config directory on linux01
      ansible.builtin.file:
        path: /etc/velociraptor
        state: directory
        mode: "0755"

    - name: Push client config to linux01
      ansible.builtin.copy:
        src: /tmp/vr-client-config.yaml
        dest: /etc/velociraptor/client.config.yaml
        mode: "0600"

    - name: Create Velociraptor client systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/velociraptor-client.service
        content: |
          [Unit]
          Description=Velociraptor Client
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/velociraptor-client --config /etc/velociraptor/client.config.yaml client
          Restart=always
          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Start Velociraptor client on linux01
      ansible.builtin.systemd:
        name: velociraptor-client
        state: started
        enabled: true
        daemon_reload: true

